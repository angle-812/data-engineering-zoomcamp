<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>基础预备 · DE Zoomcamp 学前补齐</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f5f7; --card:#fff; --line:#e3e6ec; --line-soft:#eef0f4;
  --text:#14171c; --muted:#657080; --muted-2:#8b94a2;
  --accent:#0f766e; --accent-weak:#e6f4f2; --accent-line:#bfe3de;
  --ok:#0f9d58; --ok-weak:#e8f7ef; --warn:#b45309; --warn-weak:#fff5e6;
  --blue:#2563eb; --blue-weak:#eaf0ff;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.05);
  --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1014; --card:#15191f; --line:#262c35; --line-soft:#1f252d;
    --text:#e8ecf2; --muted:#98a2b0; --muted-2:#79838f;
    --accent:#4fd1c5; --accent-weak:#122a28; --accent-line:#245049;
    --ok:#43c78a; --ok-weak:#12291f; --warn:#ffb454; --warn-weak:#2a2117;
    --blue:#74a3ff; --blue-weak:#182233;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.65 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--mono);font-size:.88em;background:var(--line-soft);
  padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
.top{position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;
  padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.back{font-size:13px;color:var(--muted)}
.ttl{font-weight:650;font-size:15.5px}
.ttl .dim{color:var(--muted);font-weight:400}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;
  font-size:13px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent-line);background:var(--accent-weak);text-decoration:none}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.go:hover{filter:brightness(1.06);background:var(--accent)}
.stats{font-size:13px;color:var(--muted);margin-left:4px}
.stats b{color:var(--accent);font-size:15px}

.grid{padding:16px;max-width:1840px;margin:0 auto}
.side,.mid,.right{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow)}
.side{position:sticky;top:66px;max-height:calc(100vh - 84px);overflow:auto;padding:10px}
.mid{min-width:0;overflow:hidden;display:flex;flex-direction:column}
.right{position:sticky;top:66px;max-height:calc(100vh - 84px);display:flex;flex-direction:column}

.ptitle{display:flex;align-items:center;gap:8px;padding:9px 8px 5px;font-size:12px;
  color:var(--muted);letter-spacing:.04em;user-select:none}
.ptitle .pn{font-weight:700;color:var(--accent)}
.ptitle .cnt{margin-left:auto;font-size:11px;color:var(--muted-2)}
.ch{display:flex;gap:8px;align-items:flex-start;width:100%;padding:7px 9px;border:0;
  background:none;border-radius:9px;cursor:pointer;text-align:left;color:inherit;
  font:inherit;font-size:13.5px;line-height:1.45}
.ch:hover{background:var(--line-soft)}
.ch.cur{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
.ch.done .no{background:var(--ok);color:#fff;border-color:var(--ok)}
.no{flex:0 0 22px;height:22px;border-radius:6px;border:1px solid var(--line);
  display:grid;place-items:center;font:600 11px/1 var(--mono);color:var(--muted);margin-top:1px}
.ch.cur .no{background:var(--accent);color:#fff;border-color:var(--accent)}
.ct{flex:1;min-width:0}
.ct .de{display:inline-block;margin-left:6px;font-size:10.5px;color:var(--blue);
  background:var(--blue-weak);border:1px solid var(--line);border-radius:5px;padding:0 4px}

.chead{padding:14px 18px 12px;border-bottom:1px solid var(--line-soft)}
.chead h1{margin:0 0 4px;font-size:19px;font-weight:680}
.chead .meta{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chead .lead{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.tag{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--accent-weak);
  color:var(--accent);border:1px solid var(--accent-line)}

/* ---------- 资源区 ---------- */
.reswrap{padding:12px 16px 14px;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.reswrap .rh{font-size:11.5px;color:var(--muted-2);letter-spacing:.05em;margin-bottom:8px;
  display:flex;align-items:center;gap:8px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px}
.rcard{display:block;padding:9px 11px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);transition:.15s;color:inherit}
.rcard:hover{border-color:var(--accent-line);box-shadow:0 2px 10px rgba(15,118,110,.08);
  text-decoration:none;transform:translateY(-1px)}
.rcard .rt{font-size:13px;font-weight:600;color:var(--accent);display:flex;gap:5px;align-items:center}
.rcard .rt .arw{color:var(--muted-2);font-size:11px;font-weight:400}
.rcard .rd{font-size:11.8px;color:var(--muted);margin-top:2px;line-height:1.45}
.rsearch{padding:8px 16px;border-bottom:1px solid var(--line-soft);display:flex;gap:7px;
  align-items:center;font-size:11.8px;color:var(--muted-2);flex-wrap:wrap}

/* ---------- 标签 ---------- */
.tabs{display:flex;gap:6px;padding:10px 14px 0;border-bottom:1px solid var(--line)}
.tab{padding:7px 13px;border:1px solid transparent;border-bottom:0;border-radius:9px 9px 0 0;
  background:none;color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer}
.tab.on{background:var(--card);border-color:var(--line);color:var(--text);font-weight:600;
  box-shadow:0 -2px 0 var(--accent) inset}
.pane{padding:16px 20px 28px;overflow:auto;max-height:calc(100vh - 420px);min-height:340px}
.pane h3{font-size:14.5px;margin:20px 0 7px;color:var(--accent)}
.pane h3:first-child{margin-top:0}
.pane p{margin:0 0 11px;text-align:justify}
.pane ul,.pane ol{margin:6px 0 12px;padding-left:1.4em}
.pane li{margin:4px 0}
.pane pre{font-family:var(--mono);font-size:12.7px;background:var(--line-soft);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;margin:9px 0;line-height:1.55}
.pane table{margin:10px 0}
.pane th{font-size:12.5px;color:var(--muted);font-weight:600}

.cmd{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:10px;
  background:var(--card)}
.cmd .k{font-family:var(--mono);font-weight:650;font-size:13.6px;color:var(--accent)}
.cmd .d{font-size:13px;color:var(--muted);margin:3px 0 0}
.cmd .ex{position:relative;margin-top:8px}
.cmd .ex pre{margin:0;font-family:var(--mono);font-size:12.5px;background:var(--line-soft);
  border:1px solid var(--line);border-radius:8px;padding:8px 44px 8px 10px;overflow:auto}
.copy{position:absolute;top:5px;right:5px;border:1px solid var(--line);background:var(--card);
  border-radius:6px;font-size:11px;padding:2px 7px;cursor:pointer;color:var(--muted)}
.copy:hover{color:var(--accent);border-color:var(--accent-line)}
.ex{border-left:3px solid var(--ok);padding:2px 0 2px 12px;margin-bottom:16px}
.ex .t{font-weight:600;font-size:14px}
.ex .note{font-size:12.5px;color:var(--muted);margin-top:4px}
.ex .ex{margin-top:8px}

.rhead{padding:12px 14px 8px;border-bottom:1px solid var(--line-soft);font-size:13px;
  font-weight:600;display:flex;align-items:center;gap:8px}
.note-box{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px 12px}
.note-box textarea{flex:1;min-height:150px;resize:vertical;border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;font:13px/1.6 var(--mono);background:var(--bg);color:var(--text)}
.note-box textarea:focus{outline:2px solid var(--accent-line);outline-offset:1px}
.nfoot{display:flex;gap:8px;font-size:11.5px;color:var(--muted-2);padding-top:6px}
.info{padding:10px 14px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line-soft)}
.kv{display:flex;gap:6px;margin:3px 0}
.kv .k{color:var(--muted-2);flex:0 0 52px}
.kv .v{color:var(--text);font-size:12px;word-break:break-all}
.mono{font-family:var(--mono);font-size:12.5px}

/* ---------- 看板 ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 60px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px}
.hero h1{margin:0 0 6px;font-size:23px;font-weight:700;letter-spacing:-.01em}
.hero .sub{color:var(--muted);font-size:13.8px;margin:0 0 14px}
.bar{height:9px;background:var(--line-soft);border-radius:6px;overflow:hidden;margin:12px 0 7px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#0f766e,#2dd4bf);width:0;transition:.4s}
.pmeta{display:flex;gap:16px;font-size:12.8px;color:var(--muted);flex-wrap:wrap}
.pmeta b{color:var(--text)}
.part{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.part .ph{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
.part .pn{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-weak);
  border:1px solid var(--accent-line);border-radius:7px;padding:2px 8px;white-space:nowrap;margin-top:2px}
.part h2{margin:0;font-size:16.5px;font-weight:680;flex:1}
.part .pc{font-size:12.5px;color:var(--muted-2)}
.part .lead{font-size:13px;color:var(--muted);margin:6px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);font-size:12.9px;color:var(--text);
  transition:.13s;cursor:pointer}
.chip:hover{border-color:var(--accent-line);background:var(--accent-weak);text-decoration:none}
.chip.done{border-color:#bfe8d4;background:var(--ok-weak);color:var(--ok)}
.chip .cn{font:600 10.5px/1 var(--mono);color:var(--muted-2)}
.chip.done .cn{color:var(--ok)}
.chip .cde{font-size:10px;color:var(--blue);background:var(--blue-weak);border-radius:4px;padding:0 4px}

.quiz{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.quiz h2{margin:0 0 4px;font-size:16.5px}
.quiz .hint{font-size:13px;color:var(--muted);margin:0 0 14px}
.qitem{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:8px;
  font-size:13.3px;cursor:pointer;line-height:1.5}
.qitem:hover{background:var(--line-soft)}
.qitem input{margin-top:4px;flex:0 0 auto;accent-color:var(--accent);width:15px;height:15px}
.qitem.on{color:var(--muted)}
.qres{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--accent-weak);
  border:1px solid var(--accent-line);font-size:13.3px;line-height:1.6}
.qres b{color:var(--accent)}
.qres .sk{font-family:var(--mono);font-size:12.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.card2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  box-shadow:var(--shadow)}
.card2 h3{margin:0 0 8px;font-size:14.5px}
.card2 table{width:100%;border-collapse:collapse;font-size:13px}
.card2 td{padding:5px 4px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.card2 td:first-child{color:var(--muted);white-space:nowrap;padding-right:10px}


/* ---------- 三栏可拖动 + 单栏收起（与 panel_resize.js 配套） ---------- */
.grid{display:flex;gap:0;align-items:flex-start}
.side{flex:0 0 272px;width:272px;min-width:0}
.mid{flex:1 1 auto;min-width:0}
.right{flex:0 0 300px;width:300px;min-width:0}
.split{flex:0 0 16px;align-self:stretch;min-height:220px;position:relative;
  cursor:col-resize;touch-action:none;background:transparent}
.split::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;
  background:var(--line);border-radius:2px;transition:background .15s,width .12s}
.split::after{content:"";position:absolute;top:50%;left:50%;width:6px;height:34px;
  margin:-17px 0 0 -3px;border-radius:3px;background:var(--line);opacity:.5;transition:.15s}
.split:hover::before,.split.drag::before{background:var(--accent);width:3px;margin-left:-1.5px}
.split:hover::after,.split.drag::after{background:var(--accent);opacity:1}
.split[hidden]{display:none}
.dragmask{position:fixed;inset:0;z-index:9999;cursor:col-resize}
.dragmask[hidden]{display:none}
.btn.tg{opacity:.6}
.btn.tg.on{opacity:1;border-color:var(--accent-line);background:var(--accent-weak);color:var(--accent)}

@media (max-width:1220px){
  .grid{flex-direction:column;align-items:stretch;gap:14px}
  .side{flex:0 0 auto;width:auto;position:static;max-height:290px}
  .right{flex:0 0 auto;width:auto;position:static;max-height:none}
  .split{display:none}
  .pane{max-height:none}
}
@media (max-width:880px){
  .grid{padding:10px}
  .side{position:static;max-height:300px}
  .wrap{padding:14px 12px 40px}
}
  .frombar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--blue-weak);border:1px solid var(--accent-line);border-radius:10px;
    padding:8px 12px;margin:0 0 12px;font-size:12.8px;color:var(--text)}
  .frombar a{margin-left:auto;font-weight:600;color:var(--blue)}
  .cmd.flash{box-shadow:0 0 0 2px var(--accent),0 0 0 6px var(--accent-weak);
    border-color:var(--accent-line);transition:box-shadow .3s,border-color .3s}
</style>
</head>

<script>var DATA = {"chapters":[{"no":1,"p":1,"t":"虚拟环境与包管理","lead":"你写的第一行 import requests 大概就会报 ModuleNotFoundError。虚拟环境是让每个项目的依赖互不打架的隔离盒，也是课程作业能跑起来的前提。","de":["01"],"ex":[{"t":"建一个干净的项目环境","c":"mkdir de-lab && cd de-lab && python -m venv .venv\n.venv\\Scripts\\activate\npython -c \"import sys; print(sys.prefix)\"\npip install pandas\npip freeze > requirements.txt\ncat requirements.txt","note":"最后一行应该能看到 pandas 及它带进来的一串依赖"},{"t":"验证隔离真的生效","c":"deactivate\npython -c \"import pandas\"","note":"应该报 ModuleNotFoundError——说明刚才那套装在盒子里，没污染全局"}],"cards":[{"k":"python -m venv .venv","d":"建虚拟环境。用 python -m 而不是直接 venv，能确保用对解释器","ex":"python -m venv .venv"},{"k":"activate","d":"激活。Windows 是 .venv\\Scripts\\activate，Git Bash 里要写 source .venv/Scripts/activate","ex":".venv\\Scripts\\activate"},{"k":"pip freeze > requirements.txt","d":"导出精确版本，别人 pip install -r 就能复现你的环境","ex":"pip freeze > requirements.txt"},{"k":"pip install -r requirements.txt","d":"按清单装回全部依赖","ex":"pip install -r requirements.txt"},{"k":"where python / which python","d":"确认现在用的是哪个解释器，装错包时第一件事查这个","ex":"where python"}],"res":[{"t":"venv 官方文档","u":"https://docs.python.org/zh-cn/3/library/venv.html","d":"虚拟环境怎么做"},{"t":"uv 文档","u":"https://docs.astral.sh/uv/","d":"更快的包管理器，官方推荐试"},{"t":"pip 文档","u":"https://pip.pypa.io/en/stable/user_guide/","d":"安装、依赖、镜像"}],"doc":"\n<p>系统里那个 Python 是所有程序共用的。你在这个项目里装 <code>pandas 2.x</code>，下个项目要 <code>1.x</code>，就会互相覆盖。虚拟环境解决的就是这件事：一个目录、一套独立的包。</p>\n<h3>最常用的一套动作</h3>\n<pre>python -m venv .venv          # 建一个叫 .venv 的隔离盒\n.venv\\Scripts\\activate        # Windows 进盒（命令行前面出现 (.venv)）\nsource .venv/bin/activate     # macOS / Linux 进盒\npip install pandas requests   # 只装进这个盒子\npip freeze &gt; requirements.txt # 把依赖记下来\ndeactivate                    # 出盒</pre>\n<p>三条最容易踩的坑：<b>①</b> 忘了激活，包装到全局去了，换台机器就复现不了；<b>②</b> 把 <code>.venv</code> 提交进 Git（几百 MB，一定加进 .gitignore）；<b>③</b> 用 <code>pip install</code> 时不看报错最后一行，实际是网络问题却以为包名写错了。</p>\n<h3>国内装包慢</h3>\n<pre>pip install -i https://pypi.tuna.tsinghua.edu.cn/simple pandas</pre>\n<p>想一劳永逸就写进配置：<code>pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple</code>。</p>\n<h3>requirements.txt 长什么样</h3>\n<pre>pandas==2.2.3\nrequests==2.32.3\nSQLAlchemy==2.0.36\npsycopg2-binary==2.9.10</pre>\n<p>课程作业要求别人能复现你的结果，所以版本号要钉住。用 <code>pip freeze</code> 生成最省事。</p>\n"},{"no":2,"p":1,"t":"文件、路径与编码","lead":"数据工程的日常有一半是读写文件。编码错误和路径拼接是最常见的两个报错源，用对工具能少踩一半。","de":["01"],"ex":[{"t":"造一个文件、读回来、统计行数","c":"python -c \"\nfrom pathlib import Path\np = Path('demo.txt')\np.write_text('第一行\\n第二行\\n第三行\\n', encoding='utf-8')\nlines = p.read_text(encoding='utf-8').splitlines()\nprint(len(lines), '行')\nprint(p.stat().st_size, '字节')\n\"","note":"中文一个字在 UTF-8 里占 3 字节，所以 12 个字左右会有 30+ 字节"},{"t":"验证 pathlib 的跨平台","c":"python -c \"from pathlib import Path; print(Path('a') / 'b' / 'c.csv')\"","note":"Windows 输出 a\\b\\c.csv，Linux 输出 a/b/c.csv——代码一样"}],"cards":[{"k":"open(path, encoding='utf-8')","d":"永远显式指定编码。BOM 文件用 utf-8-sig","ex":"open(\"a.csv\", encoding=\"utf-8\")"},{"k":"with open(...) as f","d":"上下文管理器，出异常也会关文件","ex":"with open(\"a.txt\") as f:\n    data = f.read()"},{"k":"Path / mkdir / glob","d":"路径操作三件套，跨平台、不用拼字符串","ex":"from pathlib import Path\np = Path(\"data\")\np.mkdir(parents=True, exist_ok=True)\nlist(p.glob(\"*.csv\"))"},{"k":"p.stat().st_size","d":"看文件大小，判断该逐行读还是能一次读","ex":"Path(\"a.csv\").stat().st_size"},{"k":"逐行迭代","d":"处理大文件的标准姿势，内存恒定","ex":"for line in open(\"big.csv\", encoding=\"utf-8\"):\n    process(line)"}],"res":[{"t":"pathlib","u":"https://docs.python.org/zh-cn/3/library/pathlib.html","d":"路径操作，别再用字符串拼"},{"t":"Python 标准库","u":"https://docs.python.org/zh-cn/3/library/index.html","d":"内置模块速查"}],"doc":"\n<p>读文件永远显式写编码。Windows 默认是 GBK，别人给你的 CSV 多半是 UTF-8，不写就会 <code>UnicodeDecodeError</code>。</p>\n<pre>with open(\"data.csv\", encoding=\"utf-8\") as f:\n    for line in f:              # 逐行读，1GB 文件也不会爆内存\n        print(line.rstrip())</pre>\n<p>路径别用字符串拼。<code>\"data/\" + name</code> 在 Windows 上斜杠方向会出问题，<code>pathlib</code> 一次解决：</p>\n<pre>from pathlib import Path\n\nbase = Path(\"data\")\nbase.mkdir(parents=True, exist_ok=True)   # 不存在就建，已存在不报错\n\nfor p in base.glob(\"*.csv\"):              # 找文件\n    print(p.name, p.stat().st_size // 1024, \"KB\")\n\nout = base / \"clean\" / \"result.parquet\"   # 用 / 拼路径，跨平台\nout.parent.mkdir(parents=True, exist_ok=True)</pre>\n<h3>大文件的三档处理</h3>\n<ul>\n<li><b>能逐行就别全读</b>：<code>for line in f</code>，内存占用恒定。</li>\n<li><b>结构化就用 pandas 分块</b>：<code>pd.read_csv(path, chunksize=100_000)</code>，一次 10 万行。</li>\n<li><b>要反复查就换格式</b>：CSV 换 Parquet，体积小 5-10 倍，读快 10 倍以上（第 5 节讲）。</li>\n</ul>\n<h3>编码出问题时的判断顺序</h3>\n<ol>\n<li><code>UnicodeDecodeError: 'utf-8' codec can't decode byte 0xa3</code> → 文件不是 UTF-8，试 <code>encoding=\"gbk\"</code> 或 <code>\"latin-1\"</code>。</li>\n<li>读出来开头有 <code>\\ufeff</code> → 那是 BOM，用 <code>encoding=\"utf-8-sig\"</code>。</li>\n<li>Windows 控制台打印中文变问号 → 是终端编码，不是文件问题，<code>chcp 65001</code> 切 UTF-8。</li>\n</ol>\n"},{"no":3,"p":1,"t":"异常处理与日志","lead":"数据管道会失败，这不是意外，是常态。能不能一眼看出「哪个文件、第几行、什么原因」，决定了你排查要花 5 分钟还是 2 小时。","de":["01","06"],"ex":[{"t":"让日志落到文件里","c":"python -c \"\nimport logging\nlogging.basicConfig(filename='run.log', level=logging.INFO,\n    format='%(asctime)s %(levelname)s %(message)s', encoding='utf-8')\nlogging.info('开始')\nlogging.warning('有问题')\nprint(open('run.log', encoding='utf-8').read())\n\"","note":"能看到两行，各自带时间戳和级别"},{"t":"观察异常被吞掉的后果","c":"python -c \"\ntry:\n    x = 1 / 0\nexcept Exception:\n    pass\nprint('程序继续跑了，但错误消失了')\n\"","note":"这正是最危险的反模式：管道「成功」结束，数据却少了一段"}],"cards":[{"k":"logging.basicConfig","d":"一次配置，日志同时进文件和屏幕","ex":"logging.basicConfig(level=logging.INFO,\n  format=\"%(asctime)s %(levelname)s %(message)s\")"},{"k":"log.info('%s', x)","d":"用占位符不用 f-string，性能和可检索性都更好","ex":"log.info(\"读到 %s 行\", n)"},{"k":"raise_for_status()","d":"把 4xx/5xx 变成异常，不然你拿到的是错误页 HTML 却当成功","ex":"resp = requests.get(url)\nresp.raise_for_status()"},{"k":"except 具体类型 + raise","d":"只捕能处理的，处理完继续抛，别吞异常","ex":"try:\n    work()\nexcept TimeoutError:\n    log.warning(\"超时\"); raise"},{"k":"退避重试","d":"wait * i 递增，别定速猛打","ex":"for i in range(1,4):\n    try: return fn()\n    except Exception:\n        if i==3: raise\n        time.sleep(2*i)"}],"res":[{"t":"logging 手册","u":"https://docs.python.org/zh-cn/3/howto/logging.html","d":"日志怎么写"},{"t":"12-Factor App","u":"https://12factor.net/zh_cn/","d":"配置、日志、无状态"}],"doc":"\n<p><code>print</code> 调试在脚本里不够用：跑完就没了，也没法分级。用 <code>logging</code>，五行代码就把日志同时打到屏幕和文件：</p>\n<pre>import logging\n\nlogging.basicConfig(\n    level=logging.INFO,\n    format=\"%(asctime)s | %(levelname)-7s | %(message)s\",\n    handlers=[logging.FileHandler(\"etl.log\", encoding=\"utf-8\"),\n              logging.StreamHandler()],\n)\nlog = logging.getLogger(__name__)\n\nlog.info(\"开始读取 %s\", path)\nlog.warning(\"跳过坏行：%s\", line[:80])\nlog.error(\"上传失败，重试 %d/3\", n)</pre>\n<p>注意 <code>log.info(\"读了 %s\", path)</code> 而不是 f-string——前者在日志级别关掉时不浪费格式化开销，也让日志聚合工具能按字段检索。</p>\n<h3>异常：只捕你真正能处理的</h3>\n<pre>try:\n    resp = requests.get(url, timeout=10)\n    resp.raise_for_status()\nexcept requests.Timeout:\n    log.warning(\"超时，稍后重试：%s\", url)\n    raise            # 处理不了就往上抛，别吞\nexcept requests.HTTPError as e:\n    log.error(\"HTTP %s：%s\", e.response.status_code, url)\n    raise\nfinally:\n    log.info(\"请求结束\")</pre>\n<p>三个反模式：<code>except:</code> 裸捕获（连 Ctrl+C 都吃掉）；<code>except Exception: pass</code>（错误消失，数据悄悄少一半）；把业务逻辑全塞进 try（真正出错的栈信息被盖住）。</p>\n<h3>重试：网络活必备</h3>\n<pre>import time\nfrom functools import wraps\n\ndef retry(times=3, wait=2):\n    def deco(fn):\n        @wraps(fn)\n        def wrapper(*a, **kw):\n            for i in range(1, times + 1):\n                try:\n                    return fn(*a, **kw)\n                except Exception as e:\n                    if i == times:\n                        raise\n                    log.warning(\"第 %d 次失败：%s，%ds 后重试\", i, e, wait * i)\n                    time.sleep(wait * i)      # 退避，别死循环打人家服务器\n        return wrapper\n    return deco\n\n@retry(times=3, wait=2)\ndef fetch(url):\n    return requests.get(url, timeout=10).json()</pre>\n<p>为什么必须退避：对方限流时你越急越打不进去，指数退避（2s、4s、8s）才是礼貌且有效的做法。</p>\n"},{"no":4,"p":1,"t":"调 API：requests 与分页","lead":"课程里的数据大多来自 HTTP 接口。这一节只讲你实际会用到的那几件：超时、状态码、分页、鉴权、限流。","de":["01","05"],"ex":[{"t":"用公开接口跑通一次分页","c":"python -c \"\nimport requests\nrows = []\nfor page in range(1, 4):\n    r = requests.get('https://jsonplaceholder.typicode.com/posts',\n                     params={'_page': page, '_limit': 10}, timeout=15)\n    r.raise_for_status()\n    rows += r.json()\nprint('共拿到', len(rows), '条')\nprint(rows[0])\n\"","note":"这个接口不需要 key，适合练手。注意每次请求都有 timeout"},{"t":"故意打一个 404 看异常长什么样","c":"python -c \"\nimport requests\nr = requests.get('https://jsonplaceholder.typicode.com/nope', timeout=15)\nprint('没加 raise_for_status 时：', r.status_code, '不报错')\nr.raise_for_status()\n\"","note":"最后一行会抛 HTTPError——这就是为什么必须加校验"}],"cards":[{"k":"timeout=30","d":"永远写。没有超时的请求会挂死整条管道","ex":"requests.get(url, timeout=30)"},{"k":"raise_for_status()","d":"4xx/5xx 立刻抛异常，避免把错误响应当数据存进去","ex":"r = requests.get(url, timeout=30)\nr.raise_for_status()"},{"k":"params={...}","d":"让 requests 负责 URL 编码，别自己拼 & 和中文","ex":"requests.get(url, params={\"q\": \"北京\", \"limit\": 10})"},{"k":"offset / limit 分页","d":"while 循环叠加，直到返回空列表","ex":"offset = 0\nwhile True:\n    page = get(offset)\n    if not page: break\n    rows += page; offset += len(page)"},{"k":"cursor 分页","d":"数据在变动时用游标，offset 会漏数据","ex":"p = {\"cursor\": cursor} if cursor else {}"},{"k":"429 + Retry-After","d":"被限流时按对方说的秒数等，别硬刚","ex":"time.sleep(int(r.headers.get(\"Retry-After\", 5)))"}],"res":[{"t":"requests 文档","u":"https://requests.readthedocs.io/en/latest/","d":"调 API 的标准库"},{"t":"MDN · HTTP","u":"https://developer.mozilla.org/zh-CN/docs/Web/HTTP","d":"状态码、方法、头"}],"doc":"\n<p>一个能上生产的请求，至少要有 <b>timeout</b> 和 <b>raise_for_status</b>。没有超时的请求会一直挂着，让整个管道停在那儿。</p>\n<pre>import requests\n\nresp = requests.get(\n    \"https://api.example.com/records\",\n    params={\"date\": \"2026-01-01\", \"limit\": 100, \"offset\": 0},\n    headers={\"Authorization\": \"Bearer \" + TOKEN, \"Accept\": \"application/json\"},\n    timeout=30,\n)\nresp.raise_for_status()\ndata = resp.json()          # 解析成 dict / list\nprint(resp.status_code, len(data))</pre>\n<h3>状态码要分得清</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:13.5px\">\n<tr><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">码</th><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">含义</th><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">你该做什么</th></tr>\n<tr><td style=\"padding:4px 6px\">200</td><td style=\"padding:4px 6px\">成功</td><td style=\"padding:4px 6px\">继续</td></tr>\n<tr><td style=\"padding:4px 6px\">401 / 403</td><td style=\"padding:4px 6px\">没认证 / 没权限</td><td style=\"padding:4px 6px\">查 token、查 scope，重试没用</td></tr>\n<tr><td style=\"padding:4px 6px\">404</td><td style=\"padding:4px 6px\">路径或参数错了</td><td style=\"padding:4px 6px\">查文档，别重试</td></tr>\n<tr><td style=\"padding:4px 6px\">429</td><td style=\"padding:4px 6px\">被限流</td><td style=\"padding:4px 6px\">按 Retry-After 等，再退避重试</td></tr>\n<tr><td style=\"padding:4px 6px\">5xx</td><td style=\"padding:4px 6px\">对方挂了</td><td style=\"padding:4px 6px\">退避重试，多次失败再告警</td></tr>\n</table>\n<h3>分页：两种主流模式</h3>\n<pre># 模式一：offset / limit（最常见）\noffset, rows = 0, []\nwhile True:\n    r = requests.get(url, params={\"limit\": 1000, \"offset\": offset}, timeout=30).json()\n    if not r:\n        break\n    rows += r\n    offset += len(r)\n\n# 模式二：游标（数据会变动时必须用这个，offset 会漏数据）\ncursor = None\nwhile True:\n    p = {\"limit\": 1000}\n    if cursor:\n        p[\"cursor\"] = cursor\n    j = requests.get(url, params=p, timeout=30).json()\n    rows += j[\"data\"]\n    cursor = j.get(\"next_cursor\")\n    if not cursor:\n        break</pre>\n<p>为什么游标更靠谱：一边翻页一边有新数据插入时，offset 分页会重复或漏掉记录——这在实际做增量抓取时是致命的。</p>\n<h3>限流要主动让路</h3>\n<pre>import time\nresp = requests.get(url, timeout=30)\nif resp.status_code == 429:\n    wait = int(resp.headers.get(\"Retry-After\", 5))\n    time.sleep(wait)</pre>\n"},{"no":5,"p":1,"t":"数据格式：CSV / JSON / Parquet","lead":"三种格式覆盖了 95% 的场景。选错格式，后面每一步都慢；理解它们各自的脾气，能省掉大量莫名其妙的 bug。","de":["01","03"],"ex":[{"t":"同一份数据，CSV 与 Parquet 对比","c":"python -c \"\nimport pandas as pd, os\nfrom pathlib import Path\ndf = pd.DataFrame({'id': range(200000), 'v': [i*0.5 for i in range(200000)], 'name': ['row']*200000})\ndf.to_csv('t.csv', index=False)\ndf.to_parquet('t.parquet')\nfor f in ('t.csv','t.parquet'):\n    print(f, round(Path(f).stat().st_size/1024/1024, 2), 'MB')\n\"","note":"Parquet 通常会小 5 倍以上"},{"t":"只读一列，感受列式存储","c":"python -c \"\nimport pandas as pd\nprint(pd.read_parquet('t.parquet', columns=['v']).head())\n\"","note":"只读 v 列时，id 和 name 根本没被读进内存"}],"cards":[{"k":"pd.read_csv(dtype=str)","d":"防前导 0 消失、长 ID 被转科学计数法","ex":"pd.read_csv(\"a.csv\", dtype={\"phone\": str})"},{"k":"json_normalize","d":"把嵌套 JSON 摊平成表格","ex":"pd.json_normalize(raw, record_path=\"items\")"},{"k":"to_parquet / read_parquet","d":"体积小、读得快、带类型，落盘首选","ex":"df.to_parquet(\"a.parquet\", compression=\"snappy\")"},{"k":"columns=[...]","d":"Parquet 只读需要的列，这是它最大的优势","ex":"pd.read_parquet(\"a.parquet\", columns=[\"id\"])"},{"k":"JSONL 逐行读","d":"一行一个 JSON，适合流式和日志","ex":"for line in open(\"a.jsonl\", encoding=\"utf-8\"):\n    rec = json.loads(line)"}],"res":[{"t":"pandas · IO 工具","u":"https://pandas.pydata.org/docs/user_guide/io.html","d":"读写 csv/parquet/json"},{"t":"Parquet 格式","u":"https://parquet.apache.org/docs/","d":"列式存储为什么快"},{"t":"JSON 规范","u":"https://www.json.org/json-zh.html","d":"结构就那么几种"},{"t":"CSV 的坑（RFC 4180）","u":"https://www.rfc-editor.org/rfc/rfc4180","d":"引号、换行、分隔符"}],"doc":"\n<table style=\"width:100%;border-collapse:collapse;font-size:13.5px\">\n<tr><th align=\"left\" style=\"padding:5px;border-bottom:1px solid var(--line)\">格式</th><th align=\"left\" style=\"padding:5px;border-bottom:1px solid var(--line)\">长什么样</th><th align=\"left\" style=\"padding:5px;border-bottom:1px solid var(--line)\">适合</th><th align=\"left\" style=\"padding:5px;border-bottom:1px solid var(--line)\">坑</th></tr>\n<tr><td style=\"padding:5px\"><b>CSV</b></td><td style=\"padding:5px\">纯文本，逗号分隔</td><td style=\"padding:5px\">给人看、Excel 交换、小数据</td><td style=\"padding:5px\">编码、嵌套结构、类型全丢</td></tr>\n<tr><td style=\"padding:5px\"><b>JSON</b></td><td style=\"padding:5px\">键值 / 嵌套对象</td><td style=\"padding:5px\">接口返回、配置、半结构化</td><td style=\"padding:5px\">体积大、不能按列查</td></tr>\n<tr><td style=\"padding:5px\"><b>JSONL</b></td><td style=\"padding:5px\">一行一个 JSON</td><td style=\"padding:5px\">日志、流式写入、能按行读</td><td style=\"padding:5px\">编辑器不好看</td></tr>\n<tr><td style=\"padding:5px\"><b>Parquet</b></td><td style=\"padding:5px\">列式二进制</td><td style=\"padding:5px\">分析、大数据、落仓</td><td style=\"padding:5px\">不能直接打开看</td></tr>\n</table>\n<h3>CSV 的四个真实陷阱</h3>\n<ul>\n<li><b>逗号在引号里</b>：<code>\"Beijing, China\"</code> 会被拆成两列——除非用 <code>csv</code> 模块或 pandas，别自己 <code>split(\",\")</code>。</li>\n<li><b>换行在字段里</b>：地址栏含回车，逐行读就会错位。</li>\n<li><b>编码</b>：Windows 导出的常是 GBK；带 BOM 的要 <code>utf-8-sig</code>。</li>\n<li><b>数字变了样</b>：手机号前导 0 消失、长 ID 变科学计数法——用 <code>dtype=str</code> 读。</li>\n</ul>\n<pre>import pandas as pd\n\n# 读：把可能出问题的列先当字符串\ndf = pd.read_csv(\"taxi.csv\", dtype={\"VendorID\": str}, encoding=\"utf-8\")\n\n# JSON 里取嵌套字段\ndf = pd.json_normalize(raw, record_path=\"items\", meta=[\"order_id\"])</pre>\n<h3>为什么要换 Parquet</h3>\n<p>同一份数据，CSV 100MB，Parquet 常常只 15MB，读快 10 倍以上。原因是它<b>按列存</b>：你只查 <code>trip_distance</code> 一列时，其它列根本不读。而且它自带 schema，类型不会像 CSV 那样全变字符串。</p>\n<pre>df.to_parquet(\"taxi.parquet\", compression=\"snappy\")   # 写\ndf = pd.read_parquet(\"taxi.parquet\", columns=[\"trip_distance\"])  # 只读一列</pre>\n<p>课程里下载的黄色出租车数据是 Parquet，你从 CSV 迁到 Parquet 并对比体积，是理解列式存储最快的路径。</p>\n"},{"no":6,"p":1,"t":"pandas 入门：从表格到结论","lead":"pandas 是你和 Spark 之间最好的过渡：DataFrame 这套思维先在单机练熟，之后换 Spark 只是换 API。这一节只学 20% 覆盖 80% 场景的操作。","de":["06"],"ex":[{"t":"用内置数据把「选改算」走一遍","c":"python -c \"\nimport pandas as pd\ndf = pd.read_csv('https://raw.githubusercontent.com/mwaskom/seaborn-data/master/tips.csv')\nprint(df.shape)\nprint(df.info())\nprint(df.groupby('day').agg(n=('total_bill','size'), avg=('total_bill','mean')).reset_index())\n\"","note":"需要联网。重点看 groupby 的输出结构"},{"t":"造脏数据练清洗","c":"python -c \"\nimport pandas as pd, numpy as np\ndf = pd.DataFrame({'id':[1,2,3,4],'amt':[10,None,30,40],'d':['2026-01-01','2026-01-02','bad','2026-01-04']})\ndf['d'] = pd.to_datetime(df['d'], errors='coerce')\nprint(df.isna().sum())\nprint(df.dropna(subset=['d']))\n\"","note":"bad 那一行会变 NaT，然后被 dropna 干掉"}],"cards":[{"k":"df.info()","d":"第一步就看它：列类型、非空数、内存占用","ex":"df.info()"},{"k":"loc / iloc","d":"loc 按标签，iloc 按位置。混用是经典 bug 源","ex":"df.loc[df.fare > 50, ['fare']]\ndf.iloc[0:5]"},{"k":"布尔切片","d":"每个条件加括号，用 & 和 | 连接","ex":"df[(df.a > 1) & (df.b < 5)]"},{"k":"groupby(...).agg(名=(列, 函数))","d":"具名聚合，输出直接是干净的表","ex":"df.groupby(\"k\").agg(n=(\"v\",\"size\"), s=(\"v\",\"sum\"))"},{"k":"to_datetime(errors='coerce')","d":"脏日期先转，转不了的变 NaT 而不是报错中断","ex":"pd.to_datetime(df.d, errors=\"coerce\")"},{"k":"isna().sum() / fillna","d":"缺失值先看清楚，再决定填还是删","ex":"df.isna().sum()\ndf[\"x\"].fillna(0)"}],"res":[{"t":"pandas · 10 分钟入门","u":"https://pandas.pydata.org/docs/user_guide/10min.html","d":"最好的一页速成"},{"t":"pandas · Group by","u":"https://pandas.pydata.org/docs/user_guide/groupby.html","d":"分组聚合"}],"doc":"\n<p>先把心智模型立住：<b>DataFrame = 带列名的二维表 + 行索引</b>。<code>Series</code> 是其中一列。所有操作都在「选、改、算、组」四件事里。</p>\n<pre>import pandas as pd\ndf = pd.read_csv(\"trips.csv\")\ndf.shape          # (行数, 列数)\ndf.head(5)        # 前五行\ndf.info()         # 每列类型 + 非空数量，第一步永远先看这个\ndf.describe()     # 数值列的分位数，找异常值</pre>\n<h3>选：loc / iloc 的区别要一次记牢</h3>\n<pre>df[\"fare\"]                    # 选列\ndf[[\"fare\", \"distance\"]]      # 多列\ndf.loc[3]                     # 按【标签】取行\ndf.iloc[3]                    # 按【位置】取行\ndf.loc[df.fare &gt; 50, [\"fare\", \"distance\"]]   # 条件 + 列</pre>\n<p>用布尔条件筛是最常用的写法，多个条件用 <code>&amp;</code> <code>|</code>，每个条件外面必须加括号：</p>\n<pre>hot = df[(df[\"fare\"] &gt; 50) &amp; (df[\"distance\"] &lt; 20)]\ndf[df[\"pickup\"].str.contains(\"Airport\", na=False)]</pre>\n<h3>改：新增列用向量化，别写 for 循环</h3>\n<pre>df[\"speed\"] = df[\"distance\"] / (df[\"duration\"] / 3600)   # 别用 iterrows\ndf[\"is_long\"] = df[\"distance\"] &gt; 10                      # 布尔列\ndf[\"tip_rate\"] = (df[\"tip\"] / df[\"fare\"] * 100).round(1)\ndf[\"pickup\"] = pd.to_datetime(df[\"pickup\"], errors=\"coerce\")</pre>\n<p><code>iterrows()</code> 慢几十倍，而且改不动原表。真需要逐行逻辑，用 <code>apply</code> 或 <code>np.where</code>。</p>\n<h3>算：聚合三步走</h3>\n<pre>df[\"fare\"].sum()\ndf[\"payment\"].value_counts()          # 每类多少条\ndf[\"fare\"].mean(), df[\"fare\"].median()  # 均值被极端值带跑，看中位数\n\ndf.groupby(\"payment\").agg(\n    trips=(\"fare\", \"size\"),\n    avg_fare=(\"fare\", \"mean\"),\n    total=(\"fare\", \"sum\"),\n).reset_index()</pre>\n<p><code>groupby(...).agg(新列名=(源列, 函数))</code> 这个具名写法比 <code>.agg([\"mean\",\"sum\"])</code> 可读得多，输出直接能当表用。</p>\n<h3>排序与缺失值</h3>\n<pre>df.nlargest(10, \"fare\")                 # 最大的 10 条\ndf.sort_values(\"fare\", ascending=False)\ndf.isna().sum()                         # 每列缺多少\ndf[\"tip\"] = df[\"tip\"].fillna(0)\ndf = df.dropna(subset=[\"pickup\"])       # 关键字段没值就删行</pre>\n"},{"no":7,"p":1,"t":"pandas 进阶：连接、透视与内存","lead":"真实数据永远是多张表、多种粒度。merge 写错会悄悄把行数翻倍，这是最隐蔽的数据事故。","de":["06"],"ex":[{"t":"故意造一次「行数翻倍」","c":"python -c \"\nimport pandas as pd\na = pd.DataFrame({'k':[1,2,3],'v':[10,20,30]})\nb = pd.DataFrame({'k':[1,1,2],'z':['x','y','w']})   # k=1 有两条\nout = a.merge(b, on='k', how='left')\nprint('左表', len(a), '→ 结果', len(out))\nprint(out)\n\"","note":"3 行变 4 行。这就是「一 join 多」，聚合结果会凭空变大"},{"t":"长宽表互转","c":"python -c \"\nimport pandas as pd\ndf = pd.DataFrame({'day':['d1','d1','d2'],'pay':['card','cash','card'],'amt':[10,5,7]})\nw = df.pivot_table(index='day', columns='pay', values='amt', aggfunc='sum', fill_value=0)\nprint(w)\nprint(w.reset_index().melt(id_vars='day'))\n\"","note":"melt 之后应该回到和原表一样的结构"}],"cards":[{"k":"merge 前后打 len()","d":"行数暴涨 = 键不唯一，先查 duplicated()","ex":"print(len(a), \"->\", len(a.merge(b, on=\"k\")))"},{"k":"how='left'","d":"保左表全部行；inner 只留交集","ex":"trips.merge(zones, on=\"id\", how=\"left\")"},{"k":"pivot_table","d":"长表转宽表，做报表用","ex":"df.pivot_table(index=\"d\", columns=\"k\", values=\"v\", aggfunc=\"sum\")"},{"k":"melt","d":"宽表转长表，入库用","ex":"df.melt(id_vars=\"d\", var_name=\"k\", value_name=\"v\")"},{"k":"resample('D')","d":"按日/时聚合，前提是先 set_index 成时间索引","ex":"df.set_index(\"ts\")[\"v\"].resample(\"D\").sum()"},{"k":"astype('category')","d":"低基数字符串列省大量内存","ex":"df[\"zone\"].astype(\"category\")"}],"res":[{"t":"pandas · Merge","u":"https://pandas.pydata.org/docs/user_guide/merging.html","d":"连接与拼接"},{"t":"pandas · IO 工具","u":"https://pandas.pydata.org/docs/user_guide/io.html","d":"读写 csv/parquet/json"}],"doc":"\n<h3>merge：先看行数再谈结果</h3>\n<pre>out = trips.merge(zones, on=\"PULocationID\", how=\"left\")</pre>\n<p>执行前后各打一次 <code>len()</code>。如果左表 10 万行变成 30 万，说明右表的键<b>不唯一</b>——一 joining 多，行数就膨胀。</p>\n<pre>print(len(trips), \"->\", len(out))\nprint(zones[\"LocationID\"].duplicated().sum(), \"个重复键\")   # 应先为 0</pre>\n<p>四种 how 的区别，用一句话记住：<code>left</code> 保左表全部，<code>inner</code> 只留两边都有，<code>outer</code> 全都要，<code>right</code> 保右表（很少用，不如把表换个位置写 left）。</p>\n<h3>常见错误：过滤条件写在 merge 之后</h3>\n<pre># 想要「只要机场的单」再连区域表\nbad  = trips.merge(zones, how=\"left\")\nbad  = bad[bad.zone == \"Airport\"]            # 先连了全部，再过滤，浪费\n\ngood = trips[trips.PULocationID.isin(airport_ids)].merge(zones, how=\"left\")</pre>\n<h3>透视：长表 ↔ 宽表</h3>\n<pre>wide = df.pivot_table(index=\"day\", columns=\"payment\", values=\"fare\",\n                      aggfunc=\"sum\", fill_value=0)\nlong = wide.reset_index().melt(id_vars=\"day\", var_name=\"payment\", value_name=\"fare\")</pre>\n<p>数据库里存长表（一行一条记录），报表要宽表（一行一天、每列一种支付方式）。<code>pivot_table</code> 和 <code>melt</code> 是互逆操作，两个都要会。</p>\n<h3>时间序列</h3>\n<pre>df[\"ts\"] = pd.to_datetime(df[\"ts\"])\ndf = df.set_index(\"ts\").sort_index()\ndaily = df[\"fare\"].resample(\"D\").sum()          # 按天汇总\nhourly = df[\"fare\"].resample(\"h\").mean()\ndf[\"hour\"] = df.index.hour\ndf[\"weekday\"] = df.index.day_name()</pre>\n<h3>内存：三个立刻见效的动作</h3>\n<pre>df[\"zone\"] = df[\"zone\"].astype(\"category\")     # 低基数字符串→分类，省 10 倍\ndf[\"cnt\"] = df[\"cnt\"].astype(\"int32\")          # 默认 int64，用不到那么大\nfor chunk in pd.read_csv(\"big.csv\", chunksize=200_000):   # 大文件分块\n    process(chunk)</pre>\n<p>这些在本地只是快一点，在集群上是「跑得动」和「跑不动」的区别——Spark 里同一个道理。</p>\n"},{"no":8,"p":1,"t":"把脚本写成人能维护的样子","lead":"作业交上去的不是「能跑一次」的代码，而是「别人 clone 下来能跑」的工程。差别就在这几件小事上。","de":["01","02"],"ex":[{"t":"写一个带参数的小脚本","c":"python -c \"\nimport argparse\np = argparse.ArgumentParser()\np.add_argument('--name', default='world')\np.add_argument('--times', type=int, default=1)\na = p.parse_args(['--name','DE','--times','2'])\nfor _ in range(a.times): print('hello', a.name)\n\"","note":"试试把 --times 传成 abc，argparse 会报友好错误"},{"t":"验证 __main__ 保护","c":"python -c \"\nprint('这段代码在模块顶层，import 就会执行')\nif __name__ == '__main__':\n    print('只有直接运行才执行')\n\"","note":"把它存成 m.py，再 python -c \"import m\" 对比输出"}],"cards":[{"k":"if __name__ == '__main__'","d":"模块被 import 时不执行主流程","ex":"if __name__ == \"__main__\":\n    main()"},{"k":"argparse","d":"命令行参数带帮助和默认值，比 sys.argv 强太多","ex":"p.add_argument(\"--month\", required=True)"},{"k":"os.getenv + .env","d":"配置与代码分离，密码不进仓库","ex":"load_dotenv()\nhost = os.getenv(\"PG_HOST\", \"localhost\")"},{"k":".gitignore","d":"至少排除 .venv/ .env data/ __pycache__","ex":".venv/\n.env\ndata/"},{"k":"Makefile","d":"install / run / clean 三个目标就够用，注意 Tab","ex":"run:\n\tpython pipeline.py"},{"k":"函数加类型提示","d":"参数和返回值写清楚，IDE 才能帮你查错","ex":"def load(df, table: str) -> int:"}],"res":[{"t":"argparse","u":"https://docs.python.org/zh-cn/3/library/argparse.html","d":"写带参数的脚本"},{"t":"PEP 8 中文","u":"https://pep8.cn/","d":"代码风格，团队协作看这个"},{"t":"Makefile 教程","u":"https://makefiletutorial.com/","d":"一条命令跑完整个流程"}],"doc":"\n<h3>结构：函数 + 入口</h3>\n<pre># pipeline.py\nimport argparse, logging\n\ndef extract(url: str) -> list[dict]:\n    ...\n\ndef transform(rows: list[dict]):\n    ...\n\ndef load(df, table: str) -> int:\n    ...\n\ndef main() -> None:\n    p = argparse.ArgumentParser()\n    p.add_argument(\"--month\", required=True, help=\"2026-01\")\n    p.add_argument(\"--dry-run\", action=\"store_true\")\n    args = p.parse_args()\n    rows = extract(BASE_URL.format(month=args.month))\n    df = transform(rows)\n    n = load(df, \"trips\")\n    logging.info(\"写入 %d 行\", n)\n\nif __name__ == \"__main__\":\n    main()</pre>\n<p><code>if __name__ == \"__main__\"</code> 这行的意义：别人 import 你的模块做测试时，不会顺手把整个管道跑一遍。</p>\n<h3>配置别写死在代码里</h3>\n<pre># .env（不进 Git）\nPG_HOST=localhost\nPG_USER=root\nPG_PASSWORD=root\n\n# 代码里\nimport os\nfrom pathlib import Path\nfrom dotenv import load_dotenv\nload_dotenv()\nhost = os.getenv(\"PG_HOST\", \"localhost\")</pre>\n<p><code>.gitignore</code> 必须有这几行，否则密码就进了公开仓库：</p>\n<pre>.venv/\n.env\n__pycache__/\n*.pyc\ndata/\n*.parquet</pre>\n<h3>一条命令跑完：Makefile</h3>\n<pre>install:\n\tpip install -r requirements.txt\n\nrun:\n\tpython pipeline.py --month $(MONTH)\n\nclean:\n\trm -rf data/*.parquet __pycache__</pre>\n<p>注意命令行前面是<b>真 Tab</b>，不是空格——这是 Makefile 最常见的报错。之后 <code>make run MONTH=2026-01</code> 就能跑，README 里也好写。</p>\n<h3>README 至少写四行</h3>\n<ol>\n<li>这是什么、解决什么问题；</li>\n<li>怎么装（一条命令）；</li>\n<li>怎么跑（一条命令，含参数示例）；</li>\n<li>数据从哪来、结果落在哪。</li>\n</ol>\n"},{"no":9,"p":2,"t":"OLTP 与 OLAP：两种 SQL 的差别","lead":"你练 MySQL 时写的多是「查一个用户、改一条订单」，那是 OLTP。数据工程里写的是「扫十亿行、按天汇总」，那是 OLAP。同一个 SQL 语言，两套优化思路。","de":["03"],"ex":[{"t":"装 DuckDB 并直接查一个 parquet","c":"pip install duckdb\npython -c \"\nimport duckdb, pandas as pd\npd.DataFrame({'a':[1,2,3],'b':['x','y','z']}).to_parquet('d.parquet')\nprint(duckdb.sql(\\\"SELECT b, SUM(a) s FROM 'd.parquet' GROUP BY b ORDER BY s DESC\\\").df())\n\"","note":"没建表就能查文件，这是 OLAP 引擎的典型用法"},{"t":"对比 MySQL 与 DuckDB 的语法差异","c":"python -c \"\nimport duckdb\nprint(duckdb.sql(\\\"SELECT date_trunc('month', DATE '2026-01-15')\\\").fetchall())\n\"","note":"date_trunc 在 PG/DuckDB/BigQuery 都有，MySQL 用 DATE_FORMAT 代替"}],"cards":[{"k":"SELECT 具体列，不要 *","d":"列存下 * 会扫全部列，直接翻倍账单","ex":"SELECT fare, distance FROM trips"},{"k":"分区列上别套函数","d":"WHERE DATE(ts)=... 用不上分区；WHERE ts >= ... 才行","ex":"WHERE ts >= '2026-01-01' AND ts < '2026-01-02'"},{"k":"先过滤再 JOIN","d":"把行数压小，中间结果少一个量级","ex":"WITH t AS (SELECT ... WHERE ts >= '...') SELECT ..."},{"k":"duckdb 本地练 OLAP","d":"一条 pip 就有分析引擎，能直接查 parquet","ex":"duckdb.sql(\"SELECT 1\")"}],"res":[{"t":"Mode SQL Tutorial","u":"https://mode.com/sql-tutorial/","d":"分析型 SQL 最好的免费教程"},{"t":"PostgreSQL 文档","u":"https://www.postgresql.org/docs/current/","d":"语法标准参考"},{"t":"MySQL 文档","u":"https://dev.mysql.com/doc/refman/8.4/en/","d":"你手上这套的官方手册"}],"doc":"\n<table style=\"width:100%;border-collapse:collapse;font-size:13.5px\">\n<tr><th align=\"left\" style=\"padding:5px;border-bottom:1px solid var(--line)\"></th><th align=\"left\" style=\"padding:5px;border-bottom:1px solid var(--line)\">OLTP（MySQL、Postgres）</th><th align=\"left\" style=\"padding:5px;border-bottom:1px solid var(--line)\">OLAP（BigQuery、ClickHouse、DuckDB）</th></tr>\n<tr><td style=\"padding:5px\">典型查询</td><td style=\"padding:5px\">按主键取一行、插一条</td><td style=\"padding:5px\">扫全表，按维度聚合</td></tr>\n<tr><td style=\"padding:5px\">存储方式</td><td style=\"padding:5px\"><b>行存</b>：一行连续放</td><td style=\"padding:5px\"><b>列存</b>：一列连续放</td></tr>\n<tr><td style=\"padding:5px\">优化目标</td><td style=\"padding:5px\">低延迟、高并发、小事务</td><td style=\"padding:5px\">吞吐、扫描量、压缩率</td></tr>\n<tr><td style=\"padding:5px\">索引</td><td style=\"padding:5px\">B-tree 精确命中，很关键</td><td style=\"padding:5px\">分区 + 聚簇，很少建传统索引</td></tr>\n<tr><td style=\"padding:5px\">代价模型</td><td style=\"padding:5px\">看 IO 次数</td><td style=\"padding:5px\">看<b>扫描的字节数</b>（直接等于钱）</td></tr>\n</table>\n<p>为什么列存快：你只查 <code>fare</code> 一列时，行存要把整行都读进来（含 30 个用不上的字段），列存只读那一列，还能对同类型数据做高效压缩。</p>\n<h3>这直接改变了你写 SQL 的习惯</h3>\n<ul>\n<li><b>别写 <code>SELECT *</code></b>。在 BigQuery 里它会扫全部列，账单立刻变大。只 select 你要的列。</li>\n<li><b>一定加分区过滤</b>。<code>WHERE date = '2026-01-01'</code> 能裁掉 99% 的数据；把 <code>date</code> 包在函数里（<code>WHERE DATE(ts) = '...'</code>）就用不上分区了——这是最贵的错误。</li>\n<li><b>先筛后 join</b>。把行数压到最小再连表，中间结果少一个数量级。</li>\n<li><b>少用 <code>SELECT DISTINCT</code> 兜底</b>。distinct 全表排序开销大，而且往往掩盖了上游的数据问题。</li>\n</ul>\n<h3>本机也能练 OLAP</h3>\n<pre>pip install duckdb\npython -c \"\nimport duckdb\n# 直接查 parquet，不建表、不导入\nprint(duckdb.sql('SELECT COUNT(*) FROM \\'t.parquet\\'').fetchall())\n\"</pre>\n<p>DuckDB 是单机版的分析引擎，语法接近 Postgres，课程模块 4 里 dbt 就是配 DuckDB 跑的。你现在就可以用它练窗口函数，不用等云账号。</p>\n"},{"no":10,"p":2,"t":"JOIN 全解与三个经典陷阱","lead":"JOIN 谁都会写，写对的人不多。三个坑：条件放错位置、一对多膨胀、NULL 让连接静默丢数据。","de":["03","04"],"ex":[{"t":"亲眼看到 LEFT 退化成 INNER","c":"python -c \"\nimport duckdb\nduckdb.sql(\\\"\\\"\\\"\nCREATE TABLE a AS SELECT * FROM (VALUES (1,'x'),(2,'y'),(3,'z')) t(id,k);\nCREATE TABLE b AS SELECT * FROM (VALUES (1,'X')) t(id,v);\n\\\"\\\"\\\")\nprint('ON 里过滤:', duckdb.sql('SELECT COUNT(*) FROM a LEFT JOIN b ON a.id=b.id AND b.v=\\'X\\'').fetchone())\nprint('WHERE 里过滤:', duckdb.sql('SELECT COUNT(*) FROM a LEFT JOIN b ON a.id=b.id WHERE b.v=\\'X\\'').fetchone())\n\"","note":"第一个 3 行，第二个 1 行——差别就是数据丢失"},{"t":"验证金额被重复计算","c":"python -c \"\nimport duckdb\nprint(duckdb.sql(\\\"\\\"\\\"\nWITH o AS (SELECT * FROM (VALUES (1,100),(2,200)) t(id,amt)),\n     i AS (SELECT * FROM (VALUES (1,'a'),(1,'b'),(2,'c')) t(oid,sku))\nSELECT SUM(o.amt) FROM o JOIN i ON o.id=i.oid\n\\\"\\\"\\\").fetchone(), '正确应为 300')\n\"","note":"会得到 500，因为订单 1 的 100 被算了两遍"}],"cards":[{"k":"LEFT JOIN + WHERE 右表条件","d":"会把 LEFT 退化成 INNER，丢数据","ex":"-- 要过滤右表又想保左表：条件写进 ON"},{"k":"反连接","d":"LEFT JOIN ... WHERE b.k IS NULL，等价于 NOT EXISTS 且更快","ex":"A LEFT JOIN B ON .. WHERE B.k IS NULL"},{"k":"一 join 多","d":"聚合前先确认右表键唯一，否则金额被重复计算","ex":"SELECT k, COUNT(*) FROM b GROUP BY k HAVING COUNT(*)>1"},{"k":"先聚合再连接","d":"把多的一方压成一行，避免行数膨胀","ex":"WITH agg AS (SELECT k, SUM(v) FROM b GROUP BY k)"},{"k":"NULL 不匹配","d":"NULL = NULL 结果是 NULL，不是 TRUE","ex":"ON a.k = b.k  -- a.k 为 NULL 时永不匹配"}],"res":[{"t":"Mode SQL Tutorial","u":"https://mode.com/sql-tutorial/","d":"分析型 SQL 最好的免费教程"},{"t":"SQLBolt","u":"https://sqlbolt.com/","d":"交互式 SQL 练习，从零到 join"}],"doc":"\n<h3>六种连接，一张图记住</h3>\n<pre>A INNER JOIN B   -- 两边都有的行\nA LEFT  JOIN B   -- A 全留，B 没有的补 NULL\nA RIGHT JOIN B   -- B 全留（不如反过来写 LEFT）\nA FULL  JOIN B   -- 两边都留\nA CROSS JOIN B   -- 笛卡尔积，n×m 行（慎用）\nA LEFT JOIN B ON ... WHERE B.k IS NULL   -- 反连接：只要 A 里 B 没有的</pre>\n<h3>陷阱一：条件写在 ON 还是 WHERE</h3>\n<p>这是最要命的一个。看两段 SQL 的差别：</p>\n<pre>-- ① 条件在 ON：先过滤 B，再左连接。A 的行数不变\nSELECT * FROM trips t\nLEFT JOIN zones z ON t.zone_id = z.id AND z.borough = 'Manhattan';\n\n-- ② 条件在 WHERE：先连接，再过滤。B 为 NULL 的行被删掉了，LEFT 退化成 INNER\nSELECT * FROM trips t\nLEFT JOIN zones z ON t.zone_id = z.id\nWHERE z.borough = 'Manhattan';</pre>\n<p>记住一句：<b>LEFT JOIN 里，对右表的过滤条件写在 WHERE，就等于把 LEFT 变成了 INNER</b>。</p>\n<h3>陷阱二：一 join 多，行数膨胀</h3>\n<pre>-- orders 1 万行，order_items 5 万行，一个订单多个商品\nSELECT o.id, o.amount, i.sku\nFROM orders o JOIN order_items i ON o.id = i.order_id;   -- 结果 5 万行\n\n-- 如果你再 SUM(o.amount)，金额会被重复算 5 次\nSELECT SUM(o.amount) FROM orders o JOIN order_items i ON o.id = i.order_id;  -- 错！</pre>\n<p>规避方法：先在子查询里把「多」的一方聚合成一行，再连。</p>\n<pre>WITH item_agg AS (\n  SELECT order_id, COUNT(*) AS n_items, SUM(price) AS items_total\n  FROM order_items GROUP BY order_id\n)\nSELECT o.id, o.amount, a.n_items\nFROM orders o LEFT JOIN item_agg a ON o.id = a.order_id;   -- 仍 1 万行</pre>\n<h3>陷阱三：NULL 不参与等值连接</h3>\n<pre>-- zone_id 为 NULL 的行，永远匹配不上任何东西，也不会报错\nSELECT COUNT(*) FROM trips t LEFT JOIN zones z ON t.zone_id = z.id\nWHERE z.id IS NULL;      -- 这里混着「真的没对应」和「NULL 造成的」两类</pre>\n<h3>自连接：同表两次</h3>\n<pre>-- 找每个员工和他的上级\nSELECT e.name AS emp, m.name AS mgr\nFROM emp e LEFT JOIN emp m ON e.mgr_id = m.id;</pre>\n"},{"no":11,"p":2,"t":"聚合与 GROUP BY 的完整语义","lead":"GROUP BY 有个容易忽略的规则：SELECT 里的非聚合列必须出现在 GROUP BY 里。理解为什么，才能写出不报错也不出错的 SQL。","de":["03","04"],"ex":[{"t":"一次算出多口径指标","c":"python -c \"\nimport duckdb\nprint(duckdb.sql(\\\"\\\"\\\"\nWITH t AS (SELECT * FROM (VALUES ('a',10),('a',60),('b',NULL),('b',70)) v(k,amt))\nSELECT k, COUNT(*) n, COUNT(amt) n_amt,\n       COALESCE(SUM(amt),0) s,\n       SUM(CASE WHEN amt>50 THEN 1 ELSE 0 END) big\nFROM t GROUP BY k ORDER BY k\n\\\"\\\"\\\").df())\n\"","note":"注意 k='b' 那行：n=2 但 n_amt=1，这就是 NULL 的影响"},{"t":"用 ROLLUP 出小计与总计","c":"python -c \"\nimport duckdb\nprint(duckdb.sql(\\\"\\\"\\\"\nSELECT k, g, SUM(v) s FROM (VALUES ('a','x',1),('a','y',2),('b','x',3)) t(k,g,v)\nGROUP BY ROLLUP(k,g) ORDER BY k NULLS LAST, g NULLS LAST\n\\\"\\\"\\\").df())\n\"","note":"能看到 (a,x)(a,y)(a,NULL=小计)(b,x)(b,NULL=小计)(NULL,NULL=总计)"}],"cards":[{"k":"执行顺序","d":"FROM→WHERE→GROUP BY→HAVING→SELECT→ORDER BY，能解释大部分报错","ex":"-- WHERE 里不能写聚合函数"},{"k":"COUNT(*) vs COUNT(col)","d":"后者忽略 NULL，对账时容易误判数据丢失","ex":"COUNT(*), COUNT(col), COUNT(DISTINCT col)"},{"k":"HAVING","d":"过滤分组后的结果，WHERE 做不到","ex":"GROUP BY k HAVING COUNT(*) > 100"},{"k":"COALESCE(SUM(x), 0)","d":"全 NULL 时 SUM 返回 NULL，不是 0","ex":"COALESCE(SUM(fare), 0)"},{"k":"条件聚合","d":"SUM(CASE WHEN ... THEN 1 ELSE 0 END) 一行出多个指标","ex":"SUM(CASE WHEN fare>50 THEN 1 ELSE 0 END)"},{"k":"GROUP BY 1","d":"按 select 的第 1 列分组，少写重复表达式","ex":"GROUP BY 1, 2"}],"res":[{"t":"Mode SQL Tutorial","u":"https://mode.com/sql-tutorial/","d":"分析型 SQL 最好的免费教程"},{"t":"PostgreSQL 文档","u":"https://www.postgresql.org/docs/current/","d":"语法标准参考"}],"doc":"\n<h3>执行顺序（背下来能解释大部分报错）</h3>\n<pre>FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT</pre>\n<p>所以：<code>WHERE</code> 里不能写聚合函数（那时还没分组），要过滤聚合结果用 <code>HAVING</code>。而 <code>SELECT</code> 里起的别名，<code>ORDER BY</code> 能用、<code>WHERE</code> 不能。</p>\n<pre>SELECT payment, COUNT(*) AS n, AVG(fare) AS avg_fare\nFROM trips\nWHERE fare &gt; 0                 -- 分组前筛原始行\nGROUP BY payment\nHAVING COUNT(*) &gt; 100          -- 分组后筛组\nORDER BY n DESC\nLIMIT 10;</pre>\n<h3>COUNT 的三种写法结果不同</h3>\n<pre>COUNT(*)        -- 行数（含 NULL）\nCOUNT(col)      -- 该列非 NULL 的行数\nCOUNT(DISTINCT col)  -- 去重后的非 NULL 数量</pre>\n<p>对账时最常见的事故：用 <code>COUNT(col)</code> 发现「少了几千行」，其实是那列有 NULL，不是数据丢了。</p>\n<h3>聚合函数会忽略 NULL</h3>\n<pre>AVG(x)  -- 分母是非 NULL 的个数，不是总行数\nSUM(x)  -- 全是 NULL 时返回 NULL，不是 0（要 COALESCE(SUM(x),0)）</pre>\n<h3>多维汇总：ROLLUP / GROUPING SETS</h3>\n<pre>SELECT borough, payment, SUM(fare) AS total\nFROM trips GROUP BY ROLLUP(borough, payment);\n-- 输出：每个 (borough,payment) 一行 + 每个 borough 小计 + 总计</pre>\n<p>相当于一次算出「按区按支付方式 / 按区 / 全部」三层，不用写三遍 union all。BigQuery、PG、DuckDB 都支持。</p>\n<h3>条件聚合：一行里做多个口径</h3>\n<pre>SELECT\n  DATE(ts) AS d,\n  COUNT(*) AS all_trips,\n  SUM(CASE WHEN fare &gt; 50 THEN 1 ELSE 0 END) AS big_trips,\n  AVG(CASE WHEN payment = 'card' THEN fare END) AS avg_card_fare\nFROM trips GROUP BY 1 ORDER BY 1;</pre>\n<p>这个模式在报表里到处都是——比写多个子查询再 join 快得多，也清爽得多。</p>\n"},{"no":12,"p":2,"t":"子查询与 CTE：把复杂 SQL 拆开","lead":"一段 200 行的 SQL 没人愿意改。CTE（WITH 子句）就是 SQL 里的函数拆分，是 dbt 模型的骨架写法。","de":["04"],"ex":[{"t":"用 CTE 重写嵌套子查询","c":"python -c \"\nimport duckdb\nprint(duckdb.sql(\\\"\\\"\\\"\nWITH t AS (SELECT * FROM (VALUES ('a',10),('a',30),('b',50)) v(k,v)),\n     agg AS (SELECT k, SUM(v) s FROM t GROUP BY k)\nSELECT * FROM agg WHERE s > 20 ORDER BY s DESC\n\\\"\\\"\\\").df())\n\"","note":"对比写成 FROM (SELECT ...) x WHERE 的版本，可读性差很多"},{"t":"递归 CTE 展开三层树","c":"python -c \"\nimport duckdb\nprint(duckdb.sql(\\\"\\\"\\\"\nWITH RECURSIVE n AS (SELECT * FROM (VALUES (1,NULL),(2,1),(3,1),(4,2)) t(id,pid)),\n  tree AS (SELECT id, pid, 1 d FROM n WHERE pid IS NULL\n           UNION ALL SELECT n.id, n.pid, t.d+1 FROM n JOIN tree t ON n.pid=t.id)\nSELECT * FROM tree ORDER BY id\n\\\"\\\"\\\").df())\n\"","note":"d 列就是层级深度。忘写终止条件会跑到内存爆掉"}],"cards":[{"k":"WITH x AS (...)","d":"把长 SQL 拆成有名字的中间步骤，可逐段验证","ex":"WITH clean AS (SELECT ...), daily AS (SELECT ...) SELECT * FROM daily"},{"k":"EXISTS 优于 IN","d":"子查询有 NULL 时 IN 会全不成立，EXISTS 不受影响","ex":"WHERE EXISTS (SELECT 1 FROM b WHERE b.k = a.k)"},{"k":"标量子查询","d":"放在 WHERE 里做和全局均值的比较","ex":"WHERE fare > (SELECT AVG(fare) FROM trips)"},{"k":"WITH RECURSIVE","d":"层级/树/图遍历，注意要有终止条件","ex":"WITH RECURSIVE t AS (锚点 UNION ALL 递归)"},{"k":"CTE 可能被内联","d":"重复引用会重复计算，量大时改临时表","ex":"CREATE TEMP TABLE clean AS SELECT ..."}],"res":[{"t":"PG · WITH 查询","u":"https://www.postgresql.org/docs/current/queries-with.html","d":"CTE 与递归"},{"t":"Mode SQL Tutorial","u":"https://mode.com/sql-tutorial/","d":"分析型 SQL 最好的免费教程"}],"doc":"\n<h3>子查询的三种位置</h3>\n<pre>-- ① 标量：返回一个值\nSELECT * FROM trips WHERE fare &gt; (SELECT AVG(fare) FROM trips);\n\n-- ② IN / EXISTS：判断存在\nSELECT * FROM zones z WHERE EXISTS (\n  SELECT 1 FROM trips t WHERE t.zone_id = z.id);\n\n-- ③ FROM 后面当临时表\nSELECT zone, total FROM (\n  SELECT zone_id AS zone, SUM(fare) AS total FROM trips GROUP BY 1\n) x WHERE total &gt; 10000;</pre>\n<p><code>EXISTS</code> 通常比 <code>IN</code> 安全：<code>IN</code> 遇到子查询结果里有 NULL 时，整个条件会变成「永远不成立」——这个坑在第 14 节细讲。</p>\n<h3>CTE：可读性的关键</h3>\n<pre>WITH clean AS (\n  SELECT * FROM raw_trips\n  WHERE fare &gt; 0 AND pickup IS NOT NULL\n),\ndaily AS (\n  SELECT DATE(pickup) AS d, COUNT(*) AS trips, SUM(fare) AS revenue\n  FROM clean GROUP BY 1\n),\nranked AS (\n  SELECT *, RANK() OVER (ORDER BY revenue DESC) AS rk FROM daily\n)\nSELECT * FROM ranked WHERE rk &lt;= 10;</pre>\n<p>三段各自是一个清晰的中间结果，可以逐段 <code>SELECT * FROM clean</code> 验证。这比嵌套子查询好改一百倍，也是 dbt 里每个 model 的写法。</p>\n<h3>递归 CTE：处理层级</h3>\n<pre>WITH RECURSIVE tree AS (\n  SELECT id, parent_id, 1 AS depth FROM nodes WHERE parent_id IS NULL\n  UNION ALL\n  SELECT n.id, n.parent_id, t.depth + 1\n  FROM nodes n JOIN tree t ON n.parent_id = t.id\n)\nSELECT * FROM tree ORDER BY depth;</pre>\n<p>用途很实在：组织架构、分类树、BOM 展开、图上的可达性。MySQL 8.0+ 也支持。</p>\n<h3>CTE 不等于「物化」</h3>\n<p>很多引擎会把 CTE 内联展开，重复引用同一个 CTE 就会算两遍。数据量大时，如果某段逻辑被引用多次，考虑落成临时表：</p>\n<pre>CREATE OR REPLACE TEMP TABLE clean AS SELECT ...;\n-- 之后多次引用 clean，只算一次</pre>\n"},{"no":13,"p":2,"t":"窗口函数：分析型 SQL 的分水岭","lead":"会窗口函数，SQL 水平就跨过一道线。它能在不折叠行的情况下做排名、累计、环比、取每组最新一条——这些用 GROUP BY 根本做不到。","de":["03","04","06"],"ex":[{"t":"三种排名一次看清","c":"python -c \"\nimport duckdb\nprint(duckdb.sql(\\\"\\\"\\\"\nSELECT name, score,\n  ROW_NUMBER() OVER (ORDER BY score DESC) rn,\n  RANK() OVER (ORDER BY score DESC) rk,\n  DENSE_RANK() OVER (ORDER BY score DESC) dr\nFROM (VALUES ('a',100),('b',90),('c',90),('d',80)) t(name,score)\n\\\"\\\"\\\").df())\n\"","note":"b 和 c 同为 90：rn 是 2/3，rk 是 2/2，dr 是 2/2 且下一个是 3"},{"t":"每组取最新一条 + 算环比","c":"python -c \"\nimport duckdb\nprint(duckdb.sql(\\\"\\\"\\\"\nWITH t AS (SELECT * FROM (VALUES ('u1','2026-01-01',10),('u1','2026-01-02',15),('u2','2026-01-01',7)) v(uid,d,amt)),\nlatest AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY uid ORDER BY d DESC) rn FROM t)\nSELECT uid, d, amt, amt - LAG(amt) OVER (ORDER BY d) diff FROM latest WHERE rn=1\n\\\"\\\"\\\").df())\n\"","note":"先去重到每组一行，再算差——顺序反了会算错"}],"cards":[{"k":"OVER (PARTITION BY ... ORDER BY ...)","d":"分组 + 排序，是所有窗口函数的基础","ex":"SUM(x) OVER (PARTITION BY k ORDER BY d)"},{"k":"ROW_NUMBER vs RANK","d":"前者不重复（取最新一条用它），后者并列跳号","ex":"ROW_NUMBER() OVER (PARTITION BY k ORDER BY ts DESC)"},{"k":"LAG / LEAD","d":"取前一/后一行，环比、留存、漏斗都用它","ex":"LAG(revenue) OVER (ORDER BY d)"},{"k":"NULLIF(x,0)","d":"防除零，算比率必须包一层","ex":"a / NULLIF(b, 0)"},{"k":"ROWS BETWEEN","d":"显式写帧，默认 RANGE 遇并列会算多","ex":"ROWS BETWEEN 6 PRECEDING AND CURRENT ROW"},{"k":"SUM(x) OVER ()","d":"全表总和，算占比不用额外 join","ex":"x / SUM(x) OVER ()"}],"res":[{"t":"PG · 窗口函数","u":"https://www.postgresql.org/docs/current/tutorial-window.html","d":"窗口函数逐句讲"},{"t":"MySQL · 窗口函数","u":"https://dev.mysql.com/doc/refman/8.4/en/window-functions.html","d":"8.0 起支持"},{"t":"Mode SQL Tutorial","u":"https://mode.com/sql-tutorial/","d":"分析型 SQL 最好的免费教程"}],"doc":"\n<h3>语法骨架</h3>\n<pre>函数名(...) OVER (\n  PARTITION BY 分组列      -- 相当于「每组内独立计算」\n  ORDER BY 排序列          -- 组内的顺序\n  ROWS BETWEEN ... AND ... -- 计算范围（帧）\n)</pre>\n<p>关键区别：<code>GROUP BY</code> 把多行压成一行，<b>窗口函数保留每一行</b>，只是多出一列计算结果。</p>\n<h3>排名三兄弟，差别必须一次记清</h3>\n<pre>SELECT name, score,\n  ROW_NUMBER() OVER (ORDER BY score DESC) AS rn,   -- 1,2,3,4（不重复）\n  RANK()       OVER (ORDER BY score DESC) AS rk,   -- 1,2,2,4（并列跳号）\n  DENSE_RANK() OVER (ORDER BY score DESC) AS dr    -- 1,2,2,3（并列不跳号）\nFROM scores;</pre>\n<p>取「每组最新一条」用 <code>ROW_NUMBER</code> 最稳（不会因并列返回两条）：</p>\n<pre>WITH t AS (\n  SELECT *, ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY updated_at DESC) AS rn\n  FROM users_history\n)\nSELECT * FROM t WHERE rn = 1;</pre>\n<h3>前后行：lag / lead，做环比最省事</h3>\n<pre>SELECT d, revenue,\n  LAG(revenue)  OVER (ORDER BY d) AS prev_day,\n  revenue - LAG(revenue) OVER (ORDER BY d) AS diff,\n  ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY d))\n        / NULLIF(LAG(revenue) OVER (ORDER BY d), 0), 2) AS pct_chg\nFROM daily;</pre>\n<p><code>NULLIF(x, 0)</code> 防除零——这是环比 SQL 必写的一层保护。</p>\n<h3>累计与移动平均：帧的作用</h3>\n<pre>-- 累计到当前行\nSUM(revenue) OVER (ORDER BY d ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)\n\n-- 近 7 天移动平均（含当前行，共 7 行）\nAVG(revenue) OVER (ORDER BY d ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)</pre>\n<p>不写 <code>ROWS BETWEEN</code> 时默认是 <code>RANGE ... CURRENT ROW</code>，遇到并列值会一起算进去，容易和预期不符。要精确就显式写帧。</p>\n<h3>占比：一行算出份额</h3>\n<pre>SELECT zone, trips,\n  ROUND(100.0 * trips / SUM(trips) OVER (), 2) AS pct\nFROM by_zone ORDER BY trips DESC;</pre>\n<p><code>OVER ()</code> 空括号 = 全表一个窗口，这是算总占比最简洁的写法，不用再 join 一次总数。</p>\n"},{"no":14,"p":2,"t":"NULL 与三值逻辑：最阴的坑","lead":"SQL 里 NULL 不是「空字符串」，是「不知道」。所以 NULL = NULL 的结果是 NULL（不知道），不是 TRUE。这一条能解释很多「查出来是空的但数据明明在」。","de":["03"],"ex":[{"t":"复现 NOT IN 的陷阱","c":"python -c \"\nimport duckdb\nprint(duckdb.sql(\\\"\\\"\\\"\nCREATE TABLE a AS SELECT * FROM (VALUES (1),(2),(3)) t(id);\nCREATE TABLE b AS SELECT * FROM (VALUES (2),(NULL)) t(id);\n\\\"\\\"\\\")\nprint('NOT IN :', duckdb.sql('SELECT COUNT(*) FROM a WHERE id NOT IN (SELECT id FROM b)').fetchone())\nprint('NOT EXISTS:', duckdb.sql('SELECT COUNT(*) FROM a x WHERE NOT EXISTS (SELECT 1 FROM b WHERE b.id=x.id)').fetchone())\n\"","note":"第一个是 0，第二个是 2——这就是为什么生产 SQL 里几乎不用 NOT IN"},{"t":"空值率体检","c":"python -c \"\nimport duckdb\nprint(duckdb.sql(\\\"\\\"\\\"\nSELECT COUNT(*) total,\n       COUNT(v) has_v,\n       COUNT(*) FILTER (WHERE v IS NULL) null_v,\n       ROUND(100.0*COUNT(*) FILTER (WHERE v IS NULL)/COUNT(*),1) pct_null\nFROM (VALUES (1),(NULL),(3),(NULL)) t(v)\n\\\"\\\"\\\").df())\n\"","note":"把这个查询套到你每张新表上，是数据工程的基本习惯"}],"cards":[{"k":"col IS NULL","d":"不能用 = NULL，永远返回 NULL","ex":"WHERE col IS NULL"},{"k":"NOT IN + NULL","d":"子查询有 NULL 时一行都查不出，改用 NOT EXISTS","ex":"WHERE NOT EXISTS (SELECT 1 FROM b WHERE b.k=a.k)"},{"k":"COUNT(*) vs COUNT(col)","d":"后者忽略 NULL，对账时最易误判","ex":"COUNT(*), COUNT(col)"},{"k":"COALESCE","d":"给默认值，聚合结果也常需要","ex":"COALESCE(SUM(x), 0)"},{"k":"NULLIF(x,'')","d":"空字符串转 NULL，统一口径","ex":"NULLIF(TRIM(col), '')"},{"k":"FILTER (WHERE ...)","d":"PG/DuckDB 语法，一行统计空值数","ex":"COUNT(*) FILTER (WHERE k IS NULL)"}],"res":[{"t":"SQL NULL 的语义","u":"https://en.wikipedia.org/wiki/Null_(SQL)","d":"三值逻辑，坑的源头"},{"t":"PostgreSQL 文档","u":"https://www.postgresql.org/docs/current/","d":"语法标准参考"}],"doc":"\n<h3>三条铁律</h3>\n<pre>NULL = NULL        → NULL（不是 TRUE）\nNULL &lt;&gt; NULL       → NULL\nNULL AND FALSE     → FALSE      -- 这个反而确定\nNULL AND TRUE      → NULL\nNULL OR TRUE       → TRUE       -- 有一个确定就够</pre>\n<p>WHERE 只保留结果为 TRUE 的行。<b>NULL 既不是 TRUE 也不是 FALSE，所以被丢掉</b>——这就是「条件写对了却查不出数据」的原因。</p>\n<h3>四个高发场景</h3>\n<pre>-- ① NOT IN 遇到 NULL：整个条件永远不成立\nSELECT * FROM a WHERE id NOT IN (SELECT id FROM b);\n-- 只要 b.id 里有一个 NULL，就一行都查不出来\n-- 改用 NOT EXISTS：\nSELECT * FROM a x WHERE NOT EXISTS (SELECT 1 FROM b WHERE b.id = x.id);\n\n-- ② COUNT(col) 少算\nSELECT COUNT(*) AS 全部, COUNT(zone_id) AS 有区的 FROM trips;\n\n-- ③ 聚合全空返 NULL\nSELECT COALESCE(SUM(fare), 0) FROM trips WHERE 1=0;   -- 不加就是 NULL\n\n-- ④ 等值连接匹配不上\n-- a.k 或 b.k 为 NULL 的行永远不匹配，join 静默丢行</pre>\n<h3>正确判断与处理</h3>\n<pre>WHERE col IS NULL          -- 只能用 IS NULL / IS NOT NULL\nWHERE col IS DISTINCT FROM 5   -- PG 语法：把 NULL 当成一个值来比较\n\nCOALESCE(a, b, 0)          -- 取第一个非 NULL，做默认值\nNULLIF(x, '')              -- 把空字符串变 NULL，好统一处理\nCASE WHEN col IS NULL THEN '缺失' ELSE col END</pre>\n<h3>工程上的处理原则</h3>\n<ul>\n<li><b>先量化</b>：每张表都跑一遍 <code>SELECT COUNT(*) , COUNT(*) FILTER (WHERE k IS NULL) FROM t</code>，把空值率记住。</li>\n<li><b>分清楚三种「空」</b>：真没有值（NULL）、值为空串（''）、值为 0/未知占位（-1、9999）。它们的业务含义完全不同。</li>\n<li><b>关键字段不允空</b>：主键、时间、金额上加 <code>NOT NULL</code> 约束，让问题在写入时就暴露，而不是三个月后对账才发现。</li>\n<li><b>别用 0 代替 NULL</b>：<code>AVG</code> 会把 0 算进分母，均值被拉低。该空就空。</li>\n</ul>\n"},{"no":15,"p":2,"t":"索引与执行计划","lead":"在 MySQL 里你大概听说过「加索引」。在分析型场景里规则变了：全表扫十亿行是常态，真正要管的是分区裁剪和扫描量。但看执行计划的习惯要现在养成。","de":["03"],"ex":[{"t":"在 MySQL 里看一条 SQL 的执行计划","c":"mysql -u root -p -e \"EXPLAIN SELECT * FROM your_table WHERE id = 1\\G\"","note":"重点看 type 是不是 const/ref，而不是 ALL"},{"t":"验证范围写法能走索引","c":"mysql -u root -p -e \"EXPLAIN SELECT COUNT(*) FROM your_table WHERE created_at >= '2026-01-01' AND created_at < '2026-02-01'\\G\"","note":"再试 WHERE YEAR(created_at)=2026，type 会退化成 ALL"}],"cards":[{"k":"EXPLAIN / EXPLAIN ANALYZE","d":"看 type、rows、cost、分区裁剪，别靠猜","ex":"EXPLAIN ANALYZE SELECT ..."},{"k":"最左前缀","d":"复合索引 (a,b,c) 服务不了只查 b 的语句","ex":"CREATE INDEX idx ON t (a,b,c)"},{"k":"列上别套函数","d":"WHERE YEAR(ts)=2026 失效，改范围写法","ex":"WHERE ts >= '2026-01-01' AND ts < '2027-01-01'"},{"k":"前导通配符","d":"LIKE '%x' 用不上索引","ex":"LIKE 'x%'  -- 这样可以"},{"k":"分区裁剪","d":"分析型引擎最重要的优化，省的是真金白银","ex":"WHERE dt = '2026-01-01'"},{"k":"ANALYZE TABLE","d":"统计信息过期会让优化器选错计划","ex":"ANALYZE TABLE trips"}],"res":[{"t":"Use The Index, Luke","u":"https://use-the-index-luke.com/","d":"索引与 SQL 性能，免费书"},{"t":"PG · EXPLAIN","u":"https://www.postgresql.org/docs/current/using-explain.html","d":"执行计划怎么看"},{"t":"MySQL 文档","u":"https://dev.mysql.com/doc/refman/8.4/en/","d":"你手上这套的官方手册"}],"doc":"\n<h3>B-tree 索引为什么能加速</h3>\n<p>没有索引时，查 <code>WHERE id = 12345</code> 要把整张表读一遍（全表扫描）。B-tree 索引把 id 排好序建了一棵多叉树，三层就能定位到那一行——从 O(n) 变成 O(log n)。</p>\n<p>代价：索引占空间，写入时还要维护它。所以不是越多越好。</p>\n<h3>复合索引的最左前缀</h3>\n<pre>CREATE INDEX idx ON trips (city, date, driver_id);\n\n-- 能用上：\nWHERE city='BJ'                             -- 用第 1 列\nWHERE city='BJ' AND date='2026-01-01'       -- 用前 2 列\nWHERE city='BJ' AND date='2026-01-01' AND driver_id=7   -- 全用上\n\n-- 用不上（跳过了最左列 city）：\nWHERE date='2026-01-01'\nWHERE driver_id=7</pre>\n<p>所以复合索引的列顺序按「等值条件在前、范围条件在后」排。一条 <code>(a,b,c)</code> 索引也能服务只查 <code>a</code> 的语句，反之不行。</p>\n<h3>索引失效的四种常见写法</h3>\n<pre>WHERE YEAR(created_at) = 2026        -- 列被函数包住 → 失效\nWHERE name LIKE '%abc'               -- 前置通配符 → 失效\nWHERE phone = 13800138000            -- 类型不匹配（列是字符串）→ 失效\nWHERE a OR b = 1                     -- OR 两边没都建索引 → 可能全表扫</pre>\n<p>第一条要改成范围写法：<code>WHERE created_at &gt;= '2026-01-01' AND created_at &lt; '2027-01-01'</code>。这既是索引友好的，也是分区友好的。</p>\n<h3>看执行计划：EXPLAIN</h3>\n<pre>EXPLAIN ANALYZE\nSELECT city, COUNT(*) FROM trips WHERE date = '2026-01-01' GROUP BY city;</pre>\n<p>重点看四件事：</p>\n<ul>\n<li><b>type / access</b>：<code>ALL</code> 是全表扫，<code>index</code> 是全索引扫，<code>ref</code>/<code>range</code> 才算用上了。</li>\n<li><b>rows</b>：预估扫描行数。和实际差很多，多半是统计信息旧了（<code>ANALYZE TABLE</code>）。</li>\n<li><b>cost</b>：优化器估算代价，用来对比两个写法的优劣。</li>\n<li><b>Partitions</b>（BigQuery）/ <code>Partition Pruning</code>：分区有没有被裁掉。</li>\n</ul>\n<h3>分析型引擎里真正的「索引」</h3>\n<pre>-- 分区：按天切，查询带日期条件就只扫那几天\nCREATE TABLE trips PARTITION BY DATE(pickup_datetime) ...\n\n-- 聚簇：分区内部再按列排序，范围查询更快\nCLUSTER BY zone_id</pre>\n<p>在 BigQuery 里不加分区过滤扫 100GB，加了只扫 1GB——账单差 100 倍。这是数据工程里比「建索引」重要得多的技能。</p>\n"},{"no":16,"p":2,"t":"建表、写入与事务","lead":"数据工程的一半工作是「把数据安全地写进去」。upsert、事务、约束这三件，决定了你的管道能不能重跑。","de":["01","03"],"ex":[{"t":"在 MySQL 里验证 upsert 不产生重复","c":"mysql -u root -p -e \"\nCREATE DATABASE IF NOT EXISTS lab; USE lab;\nCREATE TABLE IF NOT EXISTS t (id INT PRIMARY KEY, v INT);\nINSERT INTO t VALUES (1,10) ON DUPLICATE KEY UPDATE v=VALUES(v);\nINSERT INTO t VALUES (1,20) ON DUPLICATE KEY UPDATE v=VALUES(v);\nSELECT * FROM t;\n\"","note":"应该只有一行，v=20"},{"t":"对比逐条与批量插入","c":"python -c \"\nimport time, sqlite3\nc = sqlite3.connect(':memory:')\nc.execute('CREATE TABLE t (a INT, b TEXT)')\nrows = [(i, 'x') for i in range(20000)]\nt=time.time(); [c.execute('INSERT INTO t VALUES (?,?)', r) for r in rows]; print('逐条', round(time.time()-t,2),'s')\nc.execute('DELETE FROM t')\nt=time.time(); c.executemany('INSERT INTO t VALUES (?,?)', rows); print('批量', round(time.time()-t,2),'s')\n\"","note":"批量通常快 10 倍以上，数据量越大差距越明显"}],"cards":[{"k":"NUMERIC 存金额","d":"FLOAT 会丢精度，对账差几分钱","ex":"fare NUMERIC(10,2)"},{"k":"ON CONFLICT / ON DUPLICATE KEY","d":"upsert，重跑不产生重复行","ex":"INSERT ... ON CONFLICT (id) DO UPDATE SET ..."},{"k":"MERGE (BigQuery)","d":"按条件更新或插入，等价于 upsert","ex":"MERGE INTO t USING s ON ..."},{"k":"BEGIN ... COMMIT","d":"一组操作原子完成，失败回滚","ex":"BEGIN; DELETE ...; INSERT ...; COMMIT;"},{"k":"delete + insert","d":"分区级重跑的标准写法，避免空窗","ex":"DELETE FROM f WHERE dt='...'; INSERT INTO f SELECT ..."},{"k":"executemany / COPY","d":"批量写入比逐条快几十倍","ex":"cur.executemany(sql, rows)"}],"res":[{"t":"PostgreSQL 文档","u":"https://www.postgresql.org/docs/current/","d":"语法标准参考"},{"t":"MySQL 文档","u":"https://dev.mysql.com/doc/refman/8.4/en/","d":"你手上这套的官方手册"}],"doc":"\n<h3>建表时把类型和约束定对</h3>\n<pre>CREATE TABLE trips (\n  id            BIGINT PRIMARY KEY,\n  vendor_id     TEXT NOT NULL,\n  pickup_at     TIMESTAMPTZ NOT NULL,\n  dropoff_at    TIMESTAMPTZ,\n  passenger_count SMALLINT,\n  fare          NUMERIC(10,2) NOT NULL CHECK (fare &gt;= 0),\n  created_at    TIMESTAMPTZ DEFAULT now()\n);</pre>\n<p>类型选择的经验：<b>金额用 NUMERIC/DECIMAL 不用 FLOAT</b>（浮点会丢精度，对账永远差几分钱）；<b>时间用 TIMESTAMPTZ 不用字符串</b>；<b>能定长就用 SMALLINT/INT</b>，别全 BIGINT。</p>\n<h3>UPSERT：重跑不产生重复</h3>\n<pre>-- PostgreSQL / DuckDB\nINSERT INTO trips (id, fare) VALUES (1, 20.5)\nON CONFLICT (id) DO UPDATE SET fare = EXCLUDED.fare;\n\n-- MySQL\nINSERT INTO trips (id, fare) VALUES (1, 20.5)\nON DUPLICATE KEY UPDATE fare = VALUES(fare);\n\n-- BigQuery\nMERGE INTO trips t USING staging s ON t.id = s.id\nWHEN MATCHED THEN UPDATE SET fare = s.fare\nWHEN NOT MATCHED THEN INSERT (id, fare) VALUES (s.id, s.fare);</pre>\n<p>为什么必须有 upsert：管道失败要重跑，纯 <code>INSERT</code> 会插两遍，数据翻倍。这是新手最常见的数据事故。</p>\n<h3>事务：一组操作要么全成要么全不成</h3>\n<pre>BEGIN;\nDELETE FROM fact_trips WHERE dt = '2026-01-01';\nINSERT INTO fact_trips SELECT * FROM staging WHERE dt = '2026-01-01';\nCOMMIT;</pre>\n<p>这个「先删后插」的替换模式（delete+insert）是分区级重跑的标准做法。如果中途失败，事务回滚，旧数据还在——不会出现「删了但没插上」的空窗。</p>\n<p>四个隔离级别里，默认的 <code>READ COMMITTED</code>（PG）或 <code>REPEATABLE READ</code>（MySQL）够用。<code>SERIALIZABLE</code> 最严但并发差，别动不动就上。</p>\n<h3>批量写入比逐条快两个数量级</h3>\n<pre># 慢：一行一次往返\nfor r in rows:\n    cur.execute(\"INSERT INTO t VALUES (%s,%s)\", r)\n\n# 快：executemany 批量\ncur.executemany(\"INSERT INTO t VALUES (%s,%s)\", rows)\n\n# 更快：COPY / 直接从文件灌\ncur.copy_expert(\"COPY t FROM STDIN WITH CSV HEADER\", f)</pre>\n<p>十万行数据，逐条插可能要几分钟，<code>COPY</code> 几秒。模块 1 的作业就要把 CSV 灌进 Postgres，这个差别你马上会体会到。</p>\n"},{"no":17,"p":2,"t":"日期时间与时区","lead":"「昨天的数据」到底是哪个时区的昨天？这个问题能毁掉整张日报。数据工程里时间是第一大 bug 来源。","de":["01","03"],"ex":[{"t":"看 BETWEEN 怎么丢掉最后一天","c":"python -c \"\nimport duckdb\nprint(duckdb.sql(\\\"\\\"\\\"\nWITH t AS (SELECT * FROM (VALUES (TIMESTAMP '2026-01-30 10:00'),(TIMESTAMP '2026-01-31 23:00')) v(ts))\nSELECT 'BETWEEN' k, COUNT(*) n FROM t WHERE ts BETWEEN '2026-01-01' AND '2026-01-31'\nUNION ALL\nSELECT '半开区间', COUNT(*) FROM t WHERE ts >= '2026-01-01' AND ts < '2026-02-01'\n\\\"\\\"\\\").df())\n\"","note":"BETWEEN 只算到 31 号 00:00，23:00 那条被丢了"},{"t":"时区转换看一眼","c":"python -c \"\nimport duckdb\nprint(duckdb.sql(\\\"SELECT TIMESTAMPTZ '2026-01-01 00:00:00+08' AT TIME ZONE 'UTC' AS utc\\\").df())\n\"","note":"北京时间 1 月 1 日 0 点 = UTC 前一天 16 点。这就是跨时区报表对不上的原因"}],"cards":[{"k":"TIMESTAMPTZ + UTC 存储","d":"不要用字符串或裸 TIMESTAMP 存事件时刻","ex":"pickup_at TIMESTAMPTZ"},{"k":"date_trunc('day', ts)","d":"按天/月聚合的标准写法","ex":"date_trunc('month', ts)"},{"k":"半开区间","d":">= 起点 AND < 下个起点，别用 BETWEEN 处理时间","ex":"WHERE ts >= '2026-01-01' AND ts < '2026-02-01'"},{"k":"AT TIME ZONE","d":"跨时区转换；业务日界线要和需求方确认","ex":"ts AT TIME ZONE 'Asia/Shanghai'"},{"k":"分区列别套函数","d":"DATE(pickup_at)=... 会让分区裁剪失效","ex":"WHERE pickup_date = DATE '2026-01-01'"},{"k":"DATE_DIFF / 减 interval","d":"算时长、账龄、留存天数","ex":"DATE_DIFF('day', a, b)"}],"res":[{"t":"PG · 日期时间类型","u":"https://www.postgresql.org/docs/current/datatype-datetime.html","d":"timezone 到底存什么"},{"t":"PostgreSQL 文档","u":"https://www.postgresql.org/docs/current/","d":"语法标准参考"}],"doc":"\n<h3>三种时间类型，别混用</h3>\n<pre>DATE          -- 只有日期：2026-01-01\nTIMESTAMP     -- 不带时区：2026-01-01 10:00:00（就这一串数字，不代表某个时刻）\nTIMESTAMPTZ   -- 带时区：内部统一存 UTC，显示时按会话时区转换</pre>\n<p><b>存储一律用 TIMESTAMPTZ + UTC</b>。纽约的用户和东京的用户看同一个事件，时间必须唯一确定。</p>\n<h3>为什么不能存字符串</h3>\n<ul>\n<li>没法做日期运算（加减天数、取月初）；</li>\n<li>没法比较大小（'2026-1-2' vs '2026-01-02' 字符串比大小会错）；</li>\n<li>没法按时区转换；</li>\n<li>排序、分区、索引全部退化。</li>\n</ul>\n<h3>常用函数（PG / BigQuery / DuckDB 基本通用）</h3>\n<pre>now()                                   -- 当前时刻\nCURRENT_DATE                            -- 今天\ndate_trunc('month', ts)                 -- 截断到月初：2026-01-01\ndate_trunc('hour', ts)\nts::date                                -- 转成日期\nDATE_DIFF('day', a, b)                  -- 相差几天（BQ）\nb - a                                   -- 相差 interval（PG）\nts + INTERVAL '1 day'\nEXTRACT(DOW FROM ts)                    -- 星期几（0=周日）\nAT TIME ZONE 'Asia/Shanghai'            -- 时区转换</pre>\n<h3>三个必踩的坑</h3>\n<pre>-- ① BETWEEN 的右边界\nWHERE ts BETWEEN '2026-01-01' AND '2026-01-31'   -- 丢了 31 号当天！\nWHERE ts >= '2026-01-01' AND ts &lt; '2026-02-01'   -- 正确\n\n-- ② 时区没对齐：服务器 UTC，业务在 +08:00\n--    「1 月 1 日」的数据实际从 UTC 前一天 16:00 开始\nWHERE ts >= TIMESTAMPTZ '2026-01-01 00:00:00+08'\n\n-- ③ 夏令时：某些时区一天不是 24 小时\n--    按 date_trunc('day') 分组比按「24 小时窗口」安全</pre>\n<h3>分区表的日期列怎么用</h3>\n<pre>-- 好：常量边界，能裁剪分区\nWHERE pickup_date = DATE '2026-01-01'\n\n-- 坏：对分区列做运算，分区裁剪失效\nWHERE DATE(pickup_at) = '2026-01-01'</pre>\n<p>如果源数据是带时间的，建表时多存一个 <code>pickup_date</code> 派生列（或用 <code>PARTITION BY DATE(pickup_at)</code> 让引擎处理），查询就能一直用常量比较。</p>\n"},{"no":18,"p":2,"t":"用 SQL 做数据质量体检","lead":"在写任何管道之前，先花十分钟把这七个检查跑一遍。你对数据的了解程度，决定了后面所有决策的质量。","de":["03","04"],"ex":[{"t":"拿一张真实表跑完七条检查","c":"python -c \"\nimport duckdb\nduckdb.sql(\\\"\\\"\\\"\nCREATE TABLE t AS SELECT * FROM (VALUES\n (1,'2026-01-01',10.0,'z1'),(1,'2026-01-01',10.0,'z1'),(2,NULL,9999.0,'z2'),(3,'2026-01-03',-5.0,NULL)\n) v(id,ts,fare,zone)\n\\\"\\\"\\\")\nfor name, q in [\n ('规模','SELECT COUNT(*) rows, COUNT(DISTINCT id) uniq FROM t'),\n ('空值','SELECT COUNT(*) FILTER (WHERE ts IS NULL) null_ts, COUNT(*) FILTER (WHERE zone IS NULL) null_zone FROM t'),\n ('重复','SELECT id, COUNT(*) c FROM t GROUP BY id HAVING COUNT(*)>1'),\n ('时间','SELECT MIN(ts), MAX(ts) FROM t'),\n ('分位','SELECT AVG(fare), MIN(fare), MAX(fare) FROM t')]:\n    print(name, duckdb.sql(q).df().to_dict('records'))\n\"","note":"一张 4 行的脏表能同时暴露重复、空值、负数、极端值四类问题"},{"t":"把检查写成可复用脚本","c":"python -c \"\nimport duckdb\nq = '''SELECT 'rows' k, COUNT(*)::VARCHAR v FROM t\nUNION ALL SELECT 'uniq', COUNT(DISTINCT id)::VARCHAR FROM t\nUNION ALL SELECT 'null_ts', COUNT(*) FILTER (WHERE ts IS NULL)::VARCHAR FROM t'''\nprint(duckdb.sql(q).df())\n\"","note":"纵向输出更适合做自动检查，字段名固定好判断阈值"}],"cards":[{"k":"COUNT(*) vs COUNT(DISTINCT id)","d":"不等就说明主键不唯一，先解决再往下","ex":"COUNT(*), COUNT(DISTINCT id)"},{"k":"空值率","d":"每列都算一遍，关键字段空值率过高要报警","ex":"COUNT(*) FILTER (WHERE c IS NULL)"},{"k":"重复键 TOP N","d":"GROUP BY ... HAVING COUNT(*)>1 直接看例子","ex":"SELECT k, COUNT(*) c FROM t GROUP BY k HAVING COUNT(*)>1"},{"k":"MIN/MAX 时间","d":"看数据是否新鲜、有没有 1970 默认值","ex":"SELECT MIN(ts), MAX(ts) FROM t"},{"k":"分位数","d":"p50 vs mean 差距大 = 有极端值","ex":"PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY x)"},{"k":"孤儿行检查","d":"LEFT JOIN ... WHERE 右表为 NULL，查引用完整性","ex":"LEFT JOIN zones z ON t.zid=z.id WHERE z.id IS NULL"},{"k":"跨层行数对账","d":"raw→staging→fact 每层差异都要能解释","ex":"SELECT (SELECT COUNT(*) FROM a), (SELECT COUNT(*) FROM b)"}],"res":[{"t":"Mode SQL Tutorial","u":"https://mode.com/sql-tutorial/","d":"分析型 SQL 最好的免费教程"},{"t":"Great Expectations","u":"https://greatexpectations.io/","d":"数据质量校验框架"}],"doc":"\n<p>这七条是我每次拿到新表都会跑的，可直接套用（改成你的表名和列名）。</p>\n<h3>① 规模与粒度</h3>\n<pre>SELECT COUNT(*) AS rows, COUNT(DISTINCT id) AS uniq_id FROM t;\n-- 两者不等 → 主键不唯一，先搞清楚为什么，别急着往下做</pre>\n<h3>② 空值率</h3>\n<pre>SELECT\n  COUNT(*) AS total,\n  ROUND(100.0*COUNT(*) FILTER (WHERE pickup_at IS NULL)/COUNT(*), 2) AS pct_null_pickup,\n  ROUND(100.0*COUNT(*) FILTER (WHERE fare IS NULL)/COUNT(*), 2) AS pct_null_fare\nFROM t;</pre>\n<h3>③ 重复检测</h3>\n<pre>SELECT id, COUNT(*) c FROM t GROUP BY id HAVING COUNT(*) &gt; 1 ORDER BY c DESC LIMIT 20;\n-- 如果是「业务上允许多条」，那主键应该是复合键</pre>\n<h3>④ 时间范围</h3>\n<pre>SELECT MIN(ts) AS first, MAX(ts) AS last, COUNT(*) AS n FROM t;\n-- 常见异常：最后一条停在三天前（上游断了）、最早一条是 1970（默认值）</pre>\n<h3>⑤ 分布与异常值</h3>\n<pre>SELECT\n  MIN(fare), MAX(fare), AVG(fare),\n  PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY fare) AS p50,\n  PERCENTILE_CONT(0.99) WITHIN GROUP (ORDER BY fare) AS p99\nFROM t;\n-- 均值远大于中位数，说明有极端值；MAX 是 9999999 多半是占位符</pre>\n<h3>⑥ 引用完整性</h3>\n<pre>SELECT COUNT(*) AS orphans\nFROM trips t LEFT JOIN zones z ON t.zone_id = z.id\nWHERE z.id IS NULL AND t.zone_id IS NOT NULL;</pre>\n<h3>⑦ 行数对账（跨层）</h3>\n<pre>SELECT\n  (SELECT COUNT(*) FROM raw_trips WHERE dt='2026-01-01') AS raw,\n  (SELECT COUNT(*) FROM stg_trips WHERE dt='2026-01-01') AS staging,\n  (SELECT COUNT(*) FROM fact_trips WHERE dt='2026-01-01') AS fact;\n-- 逐层应该能解释差异（去重、过滤脏数据），解释不了就是有 bug</pre>\n<h3>把这些检查变成固定的测试</h3>\n<p>手工跑一次不够，要固化成断言。dbt 里就是 <code>tests:</code>（unique / not_null / accepted_values / relationships），课程模块 4 会用到。现在先养成习惯：<b>每个模型上线前，这七条至少要过前三条</b>。</p>\n"},{"no":19,"p":3,"t":"Git 最小可用集","lead":"你已经有 GitHub Desktop 了，这节讲它背后到底在做什么。命令行的价值在于：报错时你能看懂，卡住时你能恢复。","de":["00","01"],"ex":[{"t":"从零建一个仓库并走完一轮","c":"mkdir gitlab && cd gitlab && git init\necho '.venv/' > .gitignore\nprintf 'print(1)\\n' > a.py\ngit add . && git commit -m \"init\"\ngit switch -c feat/x\necho 'print(2)' >> a.py\ngit add a.py && git commit -m \"feat: 加一行\"\ngit log --oneline --all --graph","note":"能看到 main 和 feat/x 分叉，这是 PR 的基础"},{"t":"故意造一次冲突","c":"cd gitlab && git switch main && echo 'print(99)' >> a.py && git commit -am \"main改\" && git merge feat/x","note":"会报 CONFLICT，打开 a.py 看到 &lt;&lt;&lt;&lt;&lt;&lt;&lt; 标记，手工解决后 git add + commit"}],"cards":[{"k":"git status","d":"最常敲的一条，先看状态再操作","ex":"git status"},{"k":"git add <file>","d":"精确添加；git add . 容易带上不想提交的文件","ex":"git add pipeline.py"},{"k":"git commit -m '类型: 说明'","d":"约定式提交，历史可读","ex":"git commit -m \"feat: 增加 CSV 摄取\""},{"k":"git switch -c 分支名","d":"为新功能开分支，别直接在 main 上改","ex":"git switch -c feat/ingest"},{"k":"git pull --rebase","d":"拉取时把自己的提交接到最新之后，历史更线性","ex":"git pull --rebase"},{"k":"git restore / reset --soft","d":"撤销修改 / 撤销提交但保留改动","ex":"git restore a.py\ngit reset --soft HEAD~1"}],"res":[{"t":"Pro Git 中文版","u":"https://git-scm.com/book/zh/v2","d":"官方书，前 3 章够用"},{"t":"Git 分支练习","u":"https://learngitbranching.js.org/?locale=zh_CN","d":"可视化练 rebase/branch"},{"t":"GitHub 文档","u":"https://docs.github.com/zh","d":"仓库、PR、Actions"}],"doc":"\n<h3>三个区，一张图</h3>\n<pre>工作区（你改的文件）\n   │ git add\n   ▼\n暂存区（准备提交的变更）\n   │ git commit\n   ▼\n本地仓库（历史快照）\n   │ git push\n   ▼\n远端（GitHub）</pre>\n<p>九成的 Git 困惑都源于没分清这三个区。<code>git status</code> 会告诉你每个文件现在在哪个区。</p>\n<h3>日常六条命令</h3>\n<pre>git status                       # 现在什么状态，最常敲的一条\ngit add file.py                  # 指定文件；git add . 会带上所有变更，慎用\ngit commit -m \"fix: 修正日期解析\"\ngit push                         # 推到远端\ngit pull                         # 拉最新（push 前先 pull 是习惯）\ngit log --oneline -10            # 最近十条提交</pre>\n<h3>分支：为自己的改动开一条线</h3>\n<pre>git switch -c feat/ingest        # 新建并切到分支\n# ...改代码...\ngit add . &amp;&amp; git commit -m \"feat: 增加 CSV 摄取\"\ngit push -u origin feat/ingest   # 首次推要 -u 建立跟踪\n# 之后在 GitHub 上开 Pull Request</pre>\n<h3>冲突长什么样</h3>\n<pre>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD\ndf = pd.read_csv(path, encoding=\"utf-8\")\n=======\ndf = pd.read_csv(path, encoding=\"gbk\")\n&gt;&gt;&gt;&gt;&gt;&gt;&gt; feat/ingest</pre>\n<p>手工改成你要的结果，删掉三行标记，然后 <code>git add</code> + <code>git commit</code>。冲突不是错误，是两个人改了同一行的正常结果。</p>\n<h3>救命三条</h3>\n<pre>git restore file.py              # 丢弃未提交的修改（危险，改了就没了）\ngit reset --soft HEAD~1          # 撤销最近一次提交，改动留在暂存区\ngit log --oneline --all --graph  # 看一眼分支全貌，比慌着操作强</pre>\n<h3>.gitignore 一定要先建</h3>\n<pre>.venv/\n__pycache__/\n*.pyc\n.env\ndata/\n*.parquet\n.DS_Store</pre>\n<p>数据文件不进 Git：仓库是放代码的，数据放对象存储或本地。把 200MB 的 CSV 提交上去，之后每次 clone 都要拖这 200MB，而且删不掉历史。</p>\n"},{"no":20,"p":3,"t":"Docker 心智模型","lead":"「在我机器上能跑」是数据工程最经典的灾难。Docker 把「代码 + 依赖 + 系统库」打包成一个整体，让环境随代码走。","de":["01"],"ex":[{"t":"起一个 Postgres 并连进去","c":"docker run -d --name pg -e POSTGRES_PASSWORD=root -p 5433:5432 postgres:16\ndocker ps\ndocker exec -it pg psql -U postgres -c \"SELECT version();\"","note":"端口用 5433 避免和本机冲突"},{"t":"验证数据持久化","c":"docker exec -it pg psql -U postgres -c \"CREATE TABLE t(a int); INSERT INTO t VALUES (1);\"\ndocker restart pg\ndocker exec -it pg psql -U postgres -c \"SELECT * FROM t;\"","note":"重启后数据还在——因为写了卷。不加 -v 就会丢"}],"cards":[{"k":"docker run -d --name x -p 宿主:容器","d":"一条命令起一个服务；左边端口可改，右边不行","ex":"docker run -d --name pg -p 5432:5432 postgres:16"},{"k":"-e 环境变量","d":"镜像靠它做初始化配置（用户、密码、库名）","ex":"-e POSTGRES_PASSWORD=root"},{"k":"-v 卷名:容器路径","d":"数据持久化，容器删了数据还在","ex":"-v pgdata:/var/lib/postgresql/data"},{"k":"docker logs -f","d":"看容器输出，排查启动失败第一步","ex":"docker logs -f pg"},{"k":"docker exec -it ... bash","d":"进容器里看文件、跑命令","ex":"docker exec -it pg psql -U root"},{"k":"host.docker.internal","d":"容器访问宿主机的地址，别用 localhost","ex":"postgresql://root:root@host.docker.internal:5432/db"}],"res":[{"t":"Docker 官方入门","u":"https://docs.docker.com/get-started/","d":"镜像、容器、compose"}],"doc":"\n<h3>三个概念的关系</h3>\n<pre>Dockerfile  --构建-->  镜像(image)  --运行-->  容器(container)\n                       类                        实例</pre>\n<ul>\n<li><b>镜像</b>：只读的模板，包含操作系统层、Python、你的依赖和代码。分层存储，多个镜像能共享底层。</li>\n<li><b>容器</b>：镜像跑起来的一个进程，有自己的文件系统视图和网络。删掉容器，镜像还在。</li>\n<li><b>卷（volume）</b>：容器删了就丢数据，所以数据库的数据目录必须挂出来。</li>\n</ul>\n<h3>跑起一个 Postgres（模块 1 第一课就是这个）</h3>\n<pre>docker run -d \\\n  --name pg \\\n  -e POSTGRES_USER=root \\\n  -e POSTGRES_PASSWORD=root \\\n  -e POSTGRES_DB=ny_taxi \\\n  -v pgdata:/var/lib/postgresql/data \\\n  -p 5432:5432 \\\n  postgres:16</pre>\n<p>逐条读：<code>-d</code> 后台跑；<code>-e</code> 传环境变量（镜像靠这个知道要建什么库）；<code>-v</code> 挂卷（数据持久化）；<code>-p 5432:5432</code> 是「宿主机端口:容器端口」——左边可以改，右边不能改（那是容器里 Postgres 监听的端口）。</p>\n<h3>六个日常命令</h3>\n<pre>docker ps                       # 正在跑的容器\ndocker ps -a                    # 含已停止的\ndocker logs -f pg               # 看日志，-f 跟随\ndocker exec -it pg psql -U root -d ny_taxi   # 进容器执行命令\ndocker stop pg / docker rm pg   # 停 / 删容器\ndocker volume ls / docker volume rm pgdata   # 卷管理</pre>\n<h3>端口冲突怎么办</h3>\n<pre>docker: Error response from daemon: port is already allocated</pre>\n<p>本机 5432 已被占用（可能你自己装了 MySQL/Postgres）。改左边：<code>-p 5433:5432</code>，连接时用 5433。</p>\n<h3>容器里连宿主机的服务</h3>\n<p>容器里的 <code>localhost</code> 是容器自己，不是你的电脑。要连宿主机：</p>\n<pre>host.docker.internal   # Docker Desktop（Windows/Mac）\n172.17.0.1             # Linux 默认网桥</pre>\n<p>所以本机跑 Python 脚本、数据库在容器里时，脚本里写 <code>localhost:5432</code> 是通的；反过来（脚本在容器里、数据库在你电脑上）就要用上面那两个地址。这个搞混是模块 1 最常见的报错。</p>\n"},{"no":21,"p":3,"t":"Dockerfile 与 Compose","lead":"课程作业要求「别人 clone 下来能一键跑起来」。Dockerfile 打包你的应用，compose 编排多个服务——这套组合是交作业的标准形态。","de":["01"],"ex":[{"t":"给自己写一个小镜像","c":"mkdir -p dk && cd dk && printf 'FROM python:3.12-slim\\nWORKDIR /app\\nCOPY a.py .\\nCMD [\"python\",\"a.py\"]\\n' > Dockerfile && printf 'print(\"hello from container\")\\n' > a.py\ndocker build -t hello:1 .\ndocker run --rm hello:1","note":"能看到容器里打印出 hello"},{"t":"用 compose 起数据库 + 客户端","c":"printf 'services:\\n  db:\\n    image: postgres:16\\n    environment:\\n      POSTGRES_PASSWORD: root\\n    ports: [\"5433:5432\"]\\n' > compose.yaml\ndocker compose up -d\ndocker compose ps\ndocker compose down","note":"ps 里能看到 db 在 running"}],"cards":[{"k":"COPY requirements.txt 先装依赖","d":"利用层缓存，改代码不用重装包","ex":"COPY requirements.txt .\nRUN pip install -r requirements.txt\nCOPY . ."},{"k":"WORKDIR /app","d":"设定工作目录，后续命令都在这里","ex":"WORKDIR /app"},{"k":"docker build -t 名:tag .","d":"点号是构建上下文，别漏","ex":"docker build -t de-ingest:v1 ."},{"k":"compose 用服务名当主机名","d":"容器间访问用 pgdatabase:5432，不是 localhost","ex":"POSTGRES_HOST=pgdatabase"},{"k":"depends_on ≠ 就绪","d":"只保证启动顺序，连接要自己重试","ex":"healthcheck:\n  test: [\"CMD\", \"pg_isready\"]"},{"k":".dockerignore","d":"排除 .venv/data，构建快且镜像小","ex":".venv\ndata\n.git"}],"res":[{"t":"Dockerfile 参考","u":"https://docs.docker.com/reference/dockerfile/","d":"每条指令干什么"},{"t":"Compose 文件参考","u":"https://docs.docker.com/compose/compose-file/","d":"compose.yaml 怎么写"}],"doc":"\n<h3>一个真实的 Dockerfile</h3>\n<pre>FROM python:3.12-slim\n\nWORKDIR /app\n\n# 先只拷依赖清单并安装 —— 利用构建缓存：\n# 代码改了不会重装依赖，构建从 3 分钟变 3 秒\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY . .\n\nCMD [\"python\", \"pipeline.py\"]</pre>\n<p>为什么要分成两次 COPY：Docker 按层缓存，只要某一层的输入没变就复用。依赖清单比代码稳定得多，分开写能让日常改代码时跳过 pip install。</p>\n<h3>常用指令</h3>\n<pre>FROM     基础镜像\nWORKDIR  工作目录（之后所有命令都在这里执行）\nCOPY     从宿主机拷文件进镜像\nRUN      构建时执行（装包、建目录）\nENV      设环境变量\nEXPOSE   声明端口（只是文档性质）\nCMD      容器启动时的默认命令\nENTRYPOINT 同上，但更\"正式\"，常配 CMD 传参数</pre>\n<h3>Compose：多服务一起起</h3>\n<pre>services:\n  pgdatabase:\n    image: postgres:16\n    environment:\n      POSTGRES_USER: root\n      POSTGRES_PASSWORD: root\n      POSTGRES_DB: ny_taxi\n    volumes:\n      - pgdata:/var/lib/postgresql/data\n    ports:\n      - \"5432:5432\"\n\n  pgadmin:\n    image: dpage/pgadmin4\n    environment:\n      PGADMIN_DEFAULT_EMAIL: admin@admin.com\n      PGADMIN_DEFAULT_PASSWORD: root\n    ports:\n      - \"8080:80\"\n    depends_on:\n      - pgdatabase\n\n  ingest:\n    build: .\n    env_file: .env\n    depends_on:\n      - pgdatabase\n\nvolumes:\n  pgdata:</pre>\n<pre>docker compose up -d      # 全起来\ndocker compose logs -f    # 一起看日志\ndocker compose down       # 全停（加 -v 连卷一起删）</pre>\n<h3>三个高频报错</h3>\n<ul>\n<li><code>depends_on</code> 只保证「启
