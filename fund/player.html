动顺序」，不保证「服务就绪」。Postgres 起来要几秒，你的 ingest 可能已经开始连了。解决：应用里做重试，或用 <code>healthcheck</code> + <code>condition: service_healthy</code>。</li>\n<li>容器里连不到 <code>localhost:5432</code>：compose 里服务之间用<b>服务名</b>当主机名，写 <code>pgdatabase:5432</code>。</li>\n<li><code>COPY failed: no source files</code>：忘了 `.dockerignore`，或者构建上下文不对。加上 <code>.dockerignore</code> 排除 <code>.venv</code>、<code>data</code>，还能让构建快很多。</li>\n</ul>\n"},{"no":22,"p":3,"t":"命令行里的数据活","lead":"有些活不值得写脚本：看一眼文件多少行、把 JSON 里某个字段全提出来、统计某天的错误有多少。管道 + 几个小工具，一条命令就完。","de":["01","06"],"ex":[{"t":"统计一个 CSV 的列频次","c":"printf 'id,cat,amt\\n1,a,10\\n2,b,20\\n3,a,30\\n' > s.csv\nawk -F',' 'NR>1 {print $2}' s.csv | sort | uniq -c | sort -rn","note":"应该看到 a 出现 2 次、b 1 次"},{"t":"从 JSON 提炼字段转 CSV","c":"printf '{\"data\":[{\"id\":1,\"amt\":10},{\"id\":2,\"amt\":20}]}' > r.json\njq -r '.data[] | [.id, .amt] | @csv' r.json","note":"输出 1,10 和 2,20——调 API 后整理数据常用这招"}],"cards":[{"k":"管道串联","d":"每个工具做一件小事，| 把输出接给下一个","ex":"cat a.log | grep ERR | wc -l"},{"k":"awk -F',' '{print $1}'","d":"按分隔符取列，NR>1 跳过表头","ex":"awk -F',' 'NR>1 {print $1}' a.csv"},{"k":"sort | uniq -c | sort -rn","d":"统计频次并排序，日志分析万能套路","ex":"cut -d',' -f2 a.csv | sort | uniq -c | sort -rn"},{"k":"jq -r '.data[].id'","d":"取 JSON 字段，-r 去引号","ex":"jq -r '.items[].id' a.json"},{"k":"grep -c / -i / -v","d":"计数 / 忽略大小写 / 反向匹配","ex":"grep -c ERROR app.log"},{"k":"head / tail -f","d":"看头几行 / 实时跟日志","ex":"tail -f app.log"}],"res":[{"t":"jq 手册","u":"https://jqlang.github.io/jq/manual/","d":"命令行解析 JSON"},{"t":"MIT · Missing Semester","u":"https://missing.csail.mit.edu/","d":"命令行与工具链的经典课，Linux 体系就是按它配的"}],"doc":"\n<h3>管道的思维</h3>\n<pre>每个小工具只做一件事，用 | 串起来，前一个的输出是后一个的输入。</pre>\n<h3>文件概况</h3>\n<pre>wc -l data.csv            # 行数\nhead -3 data.csv          # 看表头\ndu -h data.csv            # 文件大小\nsort -u col.txt | wc -l   # 去重后行数</pre>\n<h3>按列处理：cut / awk</h3>\n<pre>cut -d',' -f1,3 data.csv          # 取第 1、3 列（简单场景）\nawk -F',' '{print $1, $3}' data.csv        # 同上，更灵活\nawk -F',' 'NR&gt;1 {s+=$5} END {print s}' data.csv   # 第 5 列求和</pre>\n<p><code>awk</code> 的 <code>NR&gt;1</code> 跳过表头，这个技巧天天用。</p>\n<h3>过滤与统计：grep / sort / uniq</h3>\n<pre>grep -c ERROR app.log                    # 有多少行含 ERROR\ngrep -i \"timeout\" app.log | tail -20     # 最近 20 条超时\nawk -F' ' '{print $1}' app.log | sort | uniq -c | sort -rn | head\n# 出现最多的前 10 个（日志里查高频来源的标准套路）</pre>\n<h3>JSON：jq 是必备</h3>\n<pre>jq '.' resp.json                       # 格式化\njq '.data[].id' resp.json              # 取数组里每个对象的 id\njq -r '.data[] | [.id, .amount] | @csv' resp.json &gt; out.csv   # 转 CSV\njq '[.items[].price] | add' resp.json  # 求和\njq 'select(.status == \"failed\")' resp.json</pre>\n<p><code>jq -r</code> 去掉引号，输出才能直接给别的命令用。这个工具在调 API 时能省掉大量「写个临时脚本」的时间。</p>\n<h3>替换与截取：sed</h3>\n<pre>sed 's/GBK/UTF-8/g' a.txt\nsed -n '100,120p' big.log              # 只看 100-120 行\nsed '1d' data.csv                      # 删表头</pre>\n<h3>一条真实的分析命令</h3>\n<pre># 统计某天各状态码的数量，从 Nginx 日志\ngrep '2026-01-01' access.log \\\n  | awk '{print $9}' \\\n  | sort | uniq -c | sort -rn</pre>\n<p>这类一次性分析用命令行比开 Jupyter 快得多。写超过五行还搞不定，就换 Python。</p>\n"},{"no":23,"p":3,"t":"YAML 与配置文件","lead":"Docker Compose、Kestra、dbt、GitHub Actions、Terraform 的配置全是 YAML。它语法只有几条，但缩进错一个空格就整份文件失效。","de":["01","02","04"],"ex":[{"t":"写一份 YAML 并读回来","c":"python -c \"\nimport yaml\ntxt = '''\nname: demo\nservices:\n  - web\n  - db\nenv:\n  DEBUG: true\nsql: |\n  SELECT 1\n  FROM t\n'''\nd = yaml.safe_load(txt)\nprint(d)\nprint(repr(d['sql']))\n\"","note":"sql 字段里的换行被完整保留了，这就是 | 的作用"},{"t":"验证 Tab 会失败","c":"printf 'a:\\n\\tb: 1\\n' > bad.yaml\npython -c \"import yaml;yaml.safe_load(open('bad.yaml'))\"","note":"会抛 ScannerError，提示 found character '\\t'"}],"cards":[{"k":"缩进只用空格","d":"Tab 会让整份文件失效，且报错行号常误导","ex":"  key: value"},{"k":"冒号后必须有空格","d":"name:ingest 是错的，要写 name: ingest","ex":"name: ingest"},{"k":"| 保留换行","d":"写多行 SQL / 脚本块","ex":"sql: |\n  SELECT * FROM t"},{"k":"& 锚点 / * 引用 / <<: 合并","d":"复用公共配置","ex":"defaults: &amp;c\n  restart: always\nservices:\n  a:\n    &lt;&lt;: *c"},{"k":"${VAR:-默认值}","d":"环境变量插值，带默认值","ex":"PORT: ${PORT:-5432}"},{"k":"yaml.safe_load 校验","d":"提交前跑一遍，比在 CI 里挂掉好","ex":"python -c \"import yaml;yaml.safe_load(open('a.yaml'))\""}],"res":[{"t":"YAML 速查","u":"https://learnxinyminutes.com/docs/yaml/","d":"一页看完语法"},{"t":"YAML 规范","u":"https://yaml.org/spec/1.2.2/","d":"报错时查这个"}],"doc":"\n<h3>缩进就是结构</h3>\n<pre>service:              # 键\n  name: ingest        # 两个空格缩进 = 属于 service\n  replicas: 2\n  tags:               # 列表\n    - daily\n    - critical\n  env:                # 嵌套对象\n    DB_HOST: localhost\n    DB_PORT: 5432</pre>\n<p><b>只能用空格，不能用 Tab。</b>这是 YAML 报错的第一原因，而且报错信息常常指向错误的行号。</p>\n<h3>三种标量写法</h3>\n<pre>name: plain text              # 裸写，冒号后必须有空格\nquoted: \"1234\"                # 加引号，强制当字符串\nmulti: |                      # 保留换行的多行文本（写 SQL、脚本用这个）\n  SELECT *\n  FROM trips\nfolded: &gt;                    # 折成一行（写长描述用）\n  this becomes\n  one line</pre>\n<h3>列表的两种写法</h3>\n<pre>ports:\n  - \"5432:5432\"\n  - \"8080:80\"\n\nports: [\"5432:5432\", \"8080:80\"]    # 行内写法，等价</pre>\n<h3>复用：锚点与合并</h3>\n<pre>defaults: &amp;common\n  restart: always\n  logging:\n    driver: json-file\n\nservices:\n  a:\n    &lt;&lt;: *common\n    image: postgres:16\n  b:\n    &lt;&lt;: *common\n    image: redis:7</pre>\n<p><code>&amp;common</code> 定义锚点，<code>*common</code> 引用，<code>&lt;&lt;:</code> 合并进当前对象。虽然不常用，但看到别人写别懵。</p>\n<h3>验证与常见错误</h3>\n<pre>python -c \"import yaml,sys; yaml.safe_load(open('compose.yaml'))\" &amp;&amp; echo OK\ndocker compose config      # 校验并展开成最终形态</pre>\n<table style=\"width:100%;border-collapse:collapse;font-size:13.5px\">\n<tr><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">报错</th><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">原因</th></tr>\n<tr><td style=\"padding:4px 6px\">found character '\t'</td><td style=\"padding:4px 6px\">用了 Tab，换空格</td></tr>\n<tr><td style=\"padding:4px 6px\">mapping values are not allowed here</td><td style=\"padding:4px 6px\">值里有冒号但没加引号，如 <code>time: 12:30</code></td></tr>\n<tr><td style=\"padding:4px 6px\">could not find expected ':'</td><td style=\"padding:4px 6px\">缩进层级不一致（2 空格和 4 空格混用）</td></tr>\n</table>\n<h3>环境变量插值</h3>\n<pre># compose.yaml\nenvironment:\n  DB_PASSWORD: ${DB_PASSWORD}          # 从 .env 或 shell 读\n  PORT: ${PORT:-5432}                  # 没设就用默认值</pre>\n<p>密码永远走 <code>.env</code> + 环境变量，不写在 YAML 里提交。</p>\n"},{"no":24,"p":3,"t":"VS Code、Jupyter 与调试","lead":"工具顺手，效率差一倍。这一节把三个高频动作配好：断点调试代替 print、notebook 探索、notebook 转成可调度的脚本。","de":["00"],"ex":[{"t":"写一个能被调试的脚本","c":"mkdir -p dbg && cd dbg && printf 'def calc(xs):\\n    total = 0\\n    for x in xs:\\n        total += x\\n    return total\\n\\nprint(calc([1,2,3]))\\n' > a.py","note":"在 total += x 那行设断点，F5，看 total 一步步变化"},{"t":"把 notebook 转成脚本","c":"jupyter nbconvert --to script explore.ipynb 2>/dev/null || echo '先准备一个 ipynb'","note":"转出来的 .py 通常需要手工补 if __name__ 和函数化"}],"cards":[{"k":"F5 / F9 断点","d":"替代 print，能看全部变量、逐行执行","ex":"在行号左侧点击设断点，F5 启动"},{"k":"launch.json","d":"带参数、带环境变量启动调试","ex":"\"args\": [\"--month\", \"2026-01\"]"},{"k":"jupyter lab","d":"探索数据用它，别用它上线","ex":"jupyter lab"},{"k":"nbconvert --to script","d":"notebook 转脚本，交给编排器跑","ex":"jupyter nbconvert --to script a.ipynb"},{"k":"选择解释器","d":"import 不到包时，先确认用的是 .venv 里的 python","ex":"Ctrl+Shift+P → Python: Select Interpreter"}],"res":[{"t":"VS Code 文档","u":"https://code.visualstudio.com/docs","d":"调试、终端、远程"},{"t":"Jupyter 文档","u":"https://docs.jupyter.org/en/latest/","d":"notebook 怎么用"}],"doc":"\n<h3>VS Code 必装的几个扩展</h3>\n<ul>\n<li><b>Python</b>（含 Pylance）：补全、类型检查、调试器。</li>\n<li><b>Jupyter</b>：在 VS Code 里直接开 .ipynb。</li>\n<li><b>Docker</b>：侧边栏看容器、日志、进容器终端。</li>\n<li><b>SQLTools</b> 或 <b>Database Client</b>：连 Postgres/MySQL 直接写查询。</li>\n<li><b>GitLens</b>：看每行是谁什么时候改的。</li>\n<li><b>YAML</b>：compose 文件有校验和补全。</li>\n</ul>\n<h3>断点调试：比 print 强在哪</h3>\n<p>按 <code>F5</code> 或点左侧「运行和调试」，在行号左边点一下设断点。命中断点后你能：</p>\n<ul>\n<li>在左侧看到<b>所有</b>局部变量的当前值（不用猜要 print 哪个）；</li>\n<li>逐行执行（F10 步过、F11 步入）；</li>\n<li>在「监视」里输入表达式，实时求值；</li>\n<li>在调试控制台里直接调函数、改数据。</li>\n</ul>\n<p>第一次用就会觉得以前的 print 都白写了。需要带参数启动时，配 <code>.vscode/launch.json</code>：</p>\n<pre>{\n  \"version\": \"0.2.0\",\n  \"configurations\": [{\n    \"name\": \"pipeline --month 2026-01\",\n    \"type\": \"debugpy\",\n    \"request\": \"launch\",\n    \"program\": \"${workspaceFolder}/pipeline.py\",\n    \"args\": [\"--month\", \"2026-01\"],\n    \"console\": \"integratedTerminal\"\n  }]\n}</pre>\n<h3>Jupyter：探索用它，上线不用它</h3>\n<pre>jupyter lab          # 或者直接在 VS Code 里新建 .ipynb\npip install ipykernel &amp;&amp; python -m ipykernel install --user</pre>\n<p>notebook 的价值在于「分段执行 + 立刻看结果」，适合探索数据和调 SQL。但它有三个致命问题不适合生产：</p>\n<ol>\n<li><b>执行顺序不可复现</b>：你跳着跑了第 5 格再跑第 2 格，别人重跑结果就不同。</li>\n<li><b>无法被调度</b>：编排器要的是一个能 <code>python run.py</code> 的脚本。</li>\n<li><b>diff 不可读</b>：Git 里看到的是 JSON 大杂烩。</li>\n</ol>\n<p>标准做法：<b>notebook 里探索 → 把稳定下来的逻辑搬进 .py → 用脚本跑</b>。转换很简单：</p>\n<pre>jupyter nbconvert --to script explore.ipynb</pre>\n<h3>一个提高效率的小习惯</h3>\n<p>在 VS Code 里按 <code>Ctrl+Shift+P</code> → 「Python: 选择解释器」，确认选中的是项目里 <code>.venv</code> 的那个。装了半天包却 import 不到，九成是这里选错了。</p>\n"},{"no":25,"p":4,"t":"数据工程到底在干什么","lead":"一句话：把分散在各处的数据，可靠地搬到能用的地方，并保证它是对的。这一节把整条链路和术语先过一遍，之后看课程每一模块就知道自己在哪一环。","de":["00"],"ex":[{"t":"把七个模块画成你自己的链路图","c":"纸上或编辑器里画：源→摄取→存储→转换→服务，把 01-07 标到对应位置","note":"画不出来说明还没建立整体感，看课程时会更懵"},{"t":"找一个你熟悉的业务指标，倒推链路","c":"比如「昨日订单额」：订单表在哪个库？怎么进仓库？谁算的？报表在哪看？","note":"这条倒推能立刻暴露你缺哪一环的知识"}],"cards":[{"k":"ETL vs ELT","d":"现在主流是 ELT：原样入仓，仓内转换，逻辑可重跑","ex":"-- 原始层保留原貌，转换在 warehouse 里做"},{"k":"批 vs 流","d":"批按周期，简单便宜；流低延迟，但要处理乱序重复","ex":"-- 大部分业务批处理足够"},{"k":"湖 vs 仓 vs lakehouse","d":"湖存文件，仓存优化表，lakehouse = 开放格式 + 元数据层","ex":"-- Parquet + 元数据服务"},{"k":"摄取 / 转换 / 服务","d":"链路三段，课程模块分别对应","ex":"-- 01 环境 02 调度 03 存储 04 转换"},{"k":"数据正确性 > 新功能","d":"日常七成时间在维护和对账，不是写新管道","ex":"-- 先保证对，再谈快"}],"res":[{"t":"官方前置要求","u":"https://datatalksclub.github.io/docs/courses/data-engineering-zoomcamp/prerequisites","d":"课程自己怎么说的"},{"t":"DDIA（数据密集型应用）","u":"https://dataintensive.net/","d":"数据系统圣经，第 1-3 章现在就能读"},{"t":"DataTalksClub 官方频道","u":"https://www.youtube.com/@DataTalksClub","d":"课程视频源头"}],"doc":"\n<h3>一条完整的数据链路</h3>\n<pre>数据源          摄取          存储            转换          服务\n──────       ──────       ──────         ──────       ──────\n业务库   →   批量/流式  →  数据湖/仓库  →  清洗建模  →  报表/BI\nAPI                                ↑                      ML\n日志                              调度 + 质量 + 监控        导出\n文件</pre>\n<p>课程七个模块对应这条链的不同段：</p>\n<table style=\"width:100%;border-collapse:collapse;font-size:13.5px\">\n<tr><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">模块</th><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">在链路的哪一段</th></tr>\n<tr><td style=\"padding:4px 6px\">01 Docker / Terraform</td><td style=\"padding:4px 6px\">环境与基础设施：把数据库跑起来</td></tr>\n<tr><td style=\"padding:4px 6px\">02 编排</td><td style=\"padding:4px 6px\">调度：让任务按时、按依赖跑</td></tr>\n<tr><td style=\"padding:4px 6px\">03 数据仓库</td><td style=\"padding:4px 6px\">存储：BigQuery 里怎么放、怎么省钱</td></tr>\n<tr><td style=\"padding:4px 6px\">04 分析工程</td><td style=\"padding:4px 6px\">转换：dbt 建模、测试、文档</td></tr>\n<tr><td style=\"padding:4px 6px\">05 数据平台</td><td style=\"padding:4px 6px\">端到端串起来（Bruin）</td></tr>\n<tr><td style=\"padding:4px 6px\">06 批处理</td><td style=\"padding:4px 6px\">转换的规模化：Spark</td></tr>\n<tr><td style=\"padding:4px 6px\">07 流处理</td><td style=\"padding:4px 6px\">摄取与转换的实时版：Kafka</td></tr>\n</table>\n<h3>四个必须先分清的对比</h3>\n<p><b>ETL vs ELT</b>：传统 ETL 是先转换再入库（受限于当年仓库算力贵）；现在主流是 ELT——先把原始数据<b>原样</b>灌进仓库，再用 SQL 在里面转换。好处是原始数据永远保留，转换逻辑改了能重跑。课程用的就是 ELT（BigQuery 里 dbt 跑转换）。</p>\n<p><b>批 vs 流</b>：批处理按周期跑（每天一次），简单、便宜、好排查；流处理是事件到了就处理，延迟低但要处理乱序、重复、水位线。绝大多数业务用批就够了，别为了「实时」而实时。</p>\n<p><b>数据湖 vs 仓库</b>：湖存原始文件（便宜、什么格式都行、没 schema 约束）；仓存储结构化、优化过的表（查询快、有治理）。lakehouse 是想两者兼得，底层用开放格式（Parquet/Delta/Iceberg）+ 元数据层。</p>\n<p><b>事实 vs 维度</b>：见下一节。</p>\n<h3>数据工程师的一天在干什么</h3>\n<ul>\n<li>接一个新数据源：看接口、定 schema、写摄取；</li>\n<li>修一条昨天失败的管道：看日志、定位、补数据；</li>\n<li>响应业务方：「这个指标为什么降了」——查上游、查口径；</li>\n<li>优化：这张表每天扫 2TB，加了分区过滤后变 20GB；</li>\n<li>治理：加测试、写文档、清理没人用的表。</li>\n</ul>\n<p>写新代码大概只占三成，剩下都是维护和数据正确性。这一点和「学一门语言」的体验很不一样。</p>\n"},{"no":26,"p":4,"t":"数据建模：从三范式到星型","lead":"你在 MySQL 里学的规范化是为了「不重复、不出错」；分析场景要的是「查得快、看得懂」。两套目标不同，所以建模方式也不同。","de":["04"],"ex":[{"t":"给「出租车行程」设计星型模型","c":"写下 fact_trips 的列（哪些是度量、哪些是外键），再列 3 张维度表及其属性","note":"度量：fare、distance、duration；维度：时间、区域、支付方式、司机"},{"t":"判断一个指标该放哪张表","c":"「某区某天的平均客单价」需要哪些表？粒度是什么？","note":"fact_trips 按 date+zone 聚合，维度表提供区域名"}],"cards":[{"k":"先定粒度","d":"「一行代表什么」定不下来，后面全要返工","ex":"-- fact_trips 一行 = 一趟行程"},{"k":"事实表存度量+外键","d":"数字放事实表，描述放维度表","ex":"fare, distance, zone_id"},{"k":"星型 vs 雪花","d":"维度不展开成子维度就是星型，join 少、查得快","ex":"-- 星型是分析场景默认选择"},{"k":"SCD Type 2","d":"加行 + 有效期，能还原历史状态","ex":"valid_from / valid_to / is_current"},{"k":"代理键","d":"事实表存 warehouse 自己生成的 key，不存业务 ID","ex":"customer_key 而非 customer_id"},{"k":"宽表 trade-off","d":"少 join、BI 友好，但难更新、占空间","ex":"-- dbt 里两种都能建"}],"res":[{"t":"维度建模四步法","u":"https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/","d":"事实表、维度表怎么定"},{"t":"dbt 文档","u":"https://docs.getdbt.com/docs/introduction","d":"模块 4 会用"}],"doc":"\n<h3>OLTP 的建模：三范式</h3>\n<pre>1NF  每列不可再分（不能一行存 \"北京,上海\"）\n2NF  非主键列完全依赖主键（复合主键时不能只依赖一半）\n3NF  非主键列之间不互相依赖（不能有 单价、数量、总额 三列，总额可算出来）</pre>\n<p>目标是消除冗余，保证写入一致。业务库（下单、支付）就该这么建。</p>\n<h3>OLAP 的建模：星型</h3>\n<pre>              dim_date\n                  │\ndim_zone ── fact_trips ── dim_payment\n                  │\n              dim_driver</pre>\n<p>中间一张<b>事实表</b>（每行一个业务事件，存度量值和外键），周围一圈<b>维度表</b>（描述性属性）。查询时事实表 join 维度表，形状像星星。</p>\n<table style=\"width:100%;border-collapse:collapse;font-size:13.5px\">\n<tr><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\"></th><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">事实表</th><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">维度表</th></tr>\n<tr><td style=\"padding:4px 6px\">内容</td><td style=\"padding:4px 6px\">数字（金额、次数、时长）+ 外键</td><td style=\"padding:4px 6px\">文字（名称、分类、地址）</td></tr>\n<tr><td style=\"padding:4px 6px\">行数</td><td style=\"padding:4px 6px\">巨大，持续增长</td><td style=\"padding:4px 6px\">小，相对稳定</td></tr>\n<tr><td style=\"padding:4px 6px\">例子</td><td style=\"padding:4px 6px\">fact_trips（每趟行程一行）</td><td style=\"padding:4px 6px\">dim_zone（每个区域一行）</td></tr>\n</table>\n<h3>粒度：建模第一件事</h3>\n<p>「一行代表什么」必须先定死。fact_trips 一行是一趟行程，还是一张订单，还是一个订单里的一个商品？粒度定了，事实表的键和所有度量才有意义。粒度含糊是返工的最大原因。</p>\n<h3>三种事实表</h3>\n<ul>\n<li><b>事务事实表</b>：一行一个事件（一趟行程、一次支付）。最常用。</li>\n<li><b>周期快照</b>：一行一个周期（每天末的账户余额）。适合看存量。</li>\n<li><b>累积快照</b>：一行一个流程，多个时间戳（下单→支付→发货→签收），适合看流程效率。</li>\n</ul>\n<h3>缓慢变化维度（SCD）</h3>\n<p>用户改了地址，历史订单该显示新地址还是旧地址？</p>\n<pre>Type 1  直接覆盖        简单，但历史丢失\nType 2  加一行，标记有效期   能还原「当时是哪个地址」，代价是行数增长\nType 3  加一列 previous_value  只保留上一版，用得少</pre>\n<p>Type 2 是最常见的答案，表结构长这样：</p>\n<pre>customer_key  customer_id  address    valid_from   valid_to    is_current\n1001          C-88         朝阳区     2025-01-01   2026-01-15  false\n1002          C-88         海淀区     2026-01-15   NULL        true</pre>\n<p>事实表存的是 <code>customer_key</code>（代理键），不是 <code>customer_id</code>——这样历史订单永远指向当时的地址版本。</p>\n<h3>宽表：另一种取舍</h3>\n<p>分析场景里也常把维度直接拍进一张大宽表（几百列），查询不用 join，BI 工具好用。代价是更新困难、存储放大。dbt 里这两种都能建，课程会看到。</p>\n"},{"no":27,"p":4,"t":"分层：为什么数据要分好几层","lead":"直接把源库数据喂给报表，看着省事，实际上三个月后没人说得清一个指标是怎么算出来的。分层的价值就一句话：每一层只做一件事，出错时能定位。","de":["03","04","05"],"ex":[{"t":"给出租车项目画四层","c":"列出 ods / dwd / dws / ads 各一张表，写清每张表做什么变换","note":"dwd 要做的是：去重、时间转类型、金额转 numeric、过滤 fare<0"},{"t":"判断一个变换该放哪层","c":"「把 payment_type 的 1/2/3 映射成 card/cash/no_charge」放哪层？","note":"dwd——这是统一的编码清洗，不属于聚合也不属于报表"}],"cards":[{"k":"ODS/DWD/DWS/ADS","d":"原样→清洗→汇总→应用，四层各自的职责","ex":"-- bronze/silver/gold 是同一套东西"},{"k":"原样落地","d":"第一层不做任何加工，保留重跑的可能","ex":"COPY 原始文件进 ods_*"},{"k":"每层可独立验证","d":"分层最大的价值：出错能定位到哪一层","ex":"-- 行数逐层对账"},{"k":"ref() 表达依赖","d":"dbt 靠它自动排执行顺序、生成 DAG","ex":"FROM {{ ref('stg_trips') }}"},{"k":"层数克制","d":"三四层够用，每层只做一件明确的事","ex":"-- 别为了分层而分层"}],"res":[{"t":"dbt 文档","u":"https://docs.getdbt.com/docs/introduction","d":"模块 4 会用"},{"t":"数据湖 vs 仓库","u":"https://databricks.com/glossary/data-lakehouse","d":"lakehouse 是什么"}],"doc":"\n<h3>经典四层</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:13.5px\">\n<tr><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">层</th><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">全称</th><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">做什么</th><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">例子</th></tr>\n<tr><td style=\"padding:4px 6px\">ODS</td><td style=\"padding:4px 6px\">操作数据层</td><td style=\"padding:4px 6px\">原样落地，不做任何加工</td><td style=\"padding:4px 6px\">ods_trips_raw</td></tr>\n<tr><td style=\"padding:4px 6px\">DWD</td><td style=\"padding:4px 6px\">明细数据层</td><td style=\"padding:4px 6px\">清洗、去重、统一口径、转类型</td><td style=\"padding:4px 6px\">dwd_trips</td></tr>\n<tr><td style=\"padding:4px 6px\">DWS</td><td style=\"padding:4px 6px\">汇总数据层</td><td style=\"padding:4px 6px\">按主题轻度聚合（天/区/类目）</td><td style=\"padding:4px 6px\">dws_trips_daily</td></tr>\n<tr><td style=\"padding:4px 6px\">ADS</td><td style=\"padding:4px 6px\">应用数据层</td><td style=\"padding:4px 6px\">直接给报表/接口用的结果</td><td style=\"padding:4px 6px\">ads_zone_report</td></tr>\n</table>\n<p>现代数据栈里同样的思想常叫 <b>bronze / silver / gold</b>（或 raw / staging / marts），一一对应，换个名字而已。</p>\n<h3>为什么不能只有一层</h3>\n<pre>不分层：\n  源表 → 一张巨复杂的视图 → 报表\n  问题：口径改了要动所有报表；出错不知道是源的问题还是逻辑的问题；没法复用\n\n分层：\n  源表 → ods（原样）→ dwd（清洗）→ dws（汇总）→ ads（报表）\n  好处：每层可单独验证；上游修一次，下游全受益；新人从 ads 往上追能看懂</pre>\n<h3>dbt 里的实际形态</h3>\n<pre>models/\n  staging/     stg_trips.sql        -- 对应 dwd：清洗、改名、转类型\n  intermediate/int_trips_joined.sql -- 中间关联\n  marts/       fct_trips.sql        -- 事实表\n               dim_zones.sql        -- 维度表\n               agg_daily_revenue.sql -- 汇总</pre>\n<p>dbt 用 <code>ref()</code> 表达依赖：<code>FROM {{ ref('stg_trips') }}</code>。它据此自动排出执行顺序并建 DAG——你不需要手写「先跑哪个」。</p>\n<h3>分层不是越多越好</h3>\n<p>三到四层够用。见过有人分七层，结果每层只有一行 <code>SELECT *</code>，纯属给维护加负担。判断标准：<b>这一层有没有做一件别处不做的、明确的事</b>。</p>\n"},{"no":28,"p":4,"t":"分区、文件布局与列式存储","lead":"同样是 1TB 数据，布局方式不同，查询可能差 100 倍、账单差 100 倍。这一节解释「为什么快」以及「怎么摆」。","de":["03","06"],"ex":[{"t":"对比分区与非分区的扫描量","c":"在 BigQuery 里对同一份数据建两张表（一张分区一张不分），跑同样的 WHERE dt='...' 查询，看界面显示的 bytes processed","note":"差距通常是几十到上百倍"},{"t":"控制输出文件数","c":"python -c \"\nimport pandas as pd\nfrom pathlib import Path\npd.DataFrame({'a':range(1000)}).to_parquet('one.parquet')\nprint('单文件', Path('one.parquet').stat().st_size, '字节')\n\"","note":"Spark/Hive 分区目录下如果出现大量 KB 级文件，就是该 compaction 的信号"}],"cards":[{"k":"PARTITION BY 日期","d":"查询带日期条件就能跳过绝大部分数据","ex":"PARTITION BY DATE(pickup_datetime)"},{"k":"分区列别套函数","d":"DATE(col)=x 会失效，用 col >= ... AND col < ...","ex":"WHERE ts >= '2026-01-01'"},{"k":"CLUSTER BY","d":"分区内再排序，最多 4 列，高频过滤列在前","ex":"CLUSTER BY zone_id"},{"k":"小文件问题","d":"目标 128MB-1GB，流式写入要定期合并","ex":"df.repartition(8).write.parquet(...)"},{"k":"列式只看需要的列","d":"Parquet 查 2 列就只读 2 列，CSV 要读全部","ex":"read_parquet(columns=[...])"},{"k":"扫描量=钱","d":"BigQuery 按扫描字节计费，分区是最直接的省钱手段","ex":"-- 每次查询看 bytes processed"}],"res":[{"t":"BigQuery 分区表","u":"https://cloud.google.com/bigquery/docs/partitioned-tables","d":"省钱的第一个开关"},{"t":"BigQuery 聚簇表","u":"https://cloud.google.com/bigquery/docs/clustered-tables","d":"分区之后再加一层"},{"t":"BigQuery 费用控制","u":"https://cloud.google.com/bigquery/docs/best-practices-costs","d":"别一觉醒来欠费"}],"doc":"\n<h3>分区：把大表切成小抽屉</h3>\n<pre>表按天分区后，文件系统里长这样：\n  trips/dt=2026-01-01/part-000.parquet\n  trips/dt=2026-01-02/part-000.parquet\n  ...</pre>\n<p>查 <code>WHERE dt = '2026-01-01'</code> 时，引擎直接跳过其它抽屉——这叫<b>分区裁剪</b>。</p>\n<pre>-- BigQuery 建表\nCREATE TABLE trips\nPARTITION BY DATE(pickup_datetime)\nCLUSTER BY zone_id\nAS SELECT * FROM staging.trips;</pre>\n<p>分区列的选择：<b>最常用在 WHERE 里的时间/日期列</b>。分区不要太细（按小时分一年 8760 个分区，元数据压力大），也不要太粗（按月分，查一天还是要扫整月）。按天是最常见的平衡点。</p>\n<h3>聚簇：分区内部再排序</h3>\n<p>分区解决「跳过整块」，聚簇解决「块内跳过一部分」。BigQuery 里 <code>CLUSTER BY zone_id</code> 让同一 zone 的数据物理相邻，查某个区时只读那几段。一个表最多 4 个聚簇列，按「过滤频率从高到低」排。</p>\n<h3>小文件问题</h3>\n<pre>每天写 1000 个 1KB 的小文件 vs 写 1 个 200MB 的文件\n后者快得多：打开文件的元数据开销远大于读数据本身</pre>\n<p>目标文件大小：<b>128MB ~ 1GB</b>。流式写入尤其容易产生小文件，需要定期 compaction（合并）。Spark 里用 <code>repartition</code> / <code>coalesce</code> 控制输出文件数：</p>\n<pre>df.repartition(8).write.parquet(\"out/\")   # 写 8 个文件\ndf.coalesce(1).write.parquet(\"out/\")      # 合成 1 个（小数据才这么干）</pre>\n<h3>列式格式为什么快</h3>\n<ul>\n<li><b>只读需要的列</b>：30 列里查 2 列，只读 2 列的数据。</li>\n<li><b>同类型压缩率高</b>：一列全是日期或全是金额，压缩比远超混合行。</li>\n<li><b>可用统计信息跳过</b>：Parquet 每个 row group 记录 min/max，条件不满足直接跳过。</li>\n</ul>\n<p>所以格式选 Parquet 而不是 CSV，等于免费的 5-10 倍加速。</p>\n<h3>成本和布局的关系（记住这个数量级）</h3>\n<pre>全表扫 100GB      → 约 $0.6（BigQuery 按 $6.25/TB）\n加分区后扫 1GB    → 约 $0.006\n差 100 倍。每天跑一次，一年差 $200。</pre>\n"},{"no":29,"p":4,"t":"幂等、增量与重跑","lead":"管道一定会失败，一定会重跑。判断一个数据工程师水平，看他写的管道重跑三次之后数据还对不对。","de":["02","06"],"ex":[{"t":"验证「重跑三次」的差别","c":"python -c \"\nimport duckdb\nduckdb.sql(\\\"CREATE TABLE f AS SELECT * FROM (VALUES (1,'2026-01-01'),(2,'2026-01-01')) t(id,dt)\\\")\nfor i in range(3):\n    duckdb.sql(\\\"INSERT INTO f SELECT * FROM (SELECT 3,'2026-01-01') t(id,dt)\\\")\nprint('裸 INSERT 三次:', duckdb.sql('SELECT COUNT(*) FROM f').fetchone())\n\"","note":"会变成 5 行。改成先 DELETE 再 INSERT 就是幂等的"},{"t":"写一个带日期参数的管道骨架","c":"python -c \"\nimport argparse\np = argparse.ArgumentParser()\np.add_argument('--start', required=True)\np.add_argument('--end', required=True)\na = p.parse_args(['--start','2026-01-01','--end','2026-01-03'])\nfor d in range(int(a.start[-2:]), int(a.end[-2:])+1):\n    print('处理 2026-01-%02d' % d)\n\"","note":"回填就是把区间传进去循环跑，这是编排器天然的用法"}],"cards":[{"k":"幂等三种写法","d":"覆盖分区 / MERGE / 临时表替换，别裸 INSERT","ex":"DELETE WHERE dt=...; INSERT SELECT ... WHERE dt=..."},{"k":"全量 vs 增量","d":"小表全量最省心，大表必须增量","ex":"-- 维表全量，事实表增量"},{"k":"水位线 watermark","d":"用 MAX(updated_at) 记住进度","ex":"SELECT MAX(updated_at) FROM fact"},{"k":"overlap 窗口","d":"往回多看一小时，防上游迟到，再靠 upsert 去重","ex":"WHERE ts >= max_ts - INTERVAL '1 hour'"},{"k":"参数化日期","d":"管道要能按任意区间重跑，不能写死 now()","ex":"--start 2026-01-01 --end 2026-03-31"},{"k":"空跑验证","d":"上线前用 --dry-run 或小日期区间跑通再全量","ex":"python pipe.py --start 2026-01-01 --end 2026-01-01"}],"res":[{"t":"dbt 文档","u":"https://docs.getdbt.com/docs/introduction","d":"模块 4 会用"},{"t":"DDIA（数据密集型应用）","u":"https://dataintensive.net/","d":"数据系统圣经，第 1-3 章现在就能读"}],"doc":"\n<h3>幂等：跑一次和跑三次，结果一样</h3>\n<pre>不幂等（错）：\n  INSERT INTO fact_trips SELECT * FROM staging;   -- 跑三次，数据三份\n\n幂等（对，三种写法）：\n  ① 覆盖分区\n     DELETE FROM fact_trips WHERE dt = '{{ ds }}';\n     INSERT INTO fact_trips SELECT * FROM staging WHERE dt = '{{ ds }}';\n\n  ② MERGE / UPSERT\n     MERGE INTO fact_trips t USING staging s ON t.id = s.id\n     WHEN MATCHED THEN UPDATE ... WHEN NOT MATCHED THEN INSERT ...;\n\n  ③ 写临时表再原子替换\n     CREATE OR REPLACE TABLE fact_trips AS SELECT ...;</pre>\n<h3>全量 vs 增量</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:13.5px\">\n<tr><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\"></th><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">全量</th><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">增量</th></tr>\n<tr><td style=\"padding:4px 6px\">做法</td><td style=\"padding:4px 6px\">每次重拉全部数据</td><td style=\"padding:4px 6px\">只拉上次之后的新/变数据</td></tr>\n<tr><td style=\"padding:4px 6px\">优点</td><td style=\"padding:4px 6px\">简单，不会漏，能自愈</td><td style=\"padding:4px 6px\">快、省、能跑大数据量</td></tr>\n<tr><td style=\"padding:4px 6px\">缺点</td><td style=\"padding:4px 6px\">数据一大就跑不动</td><td style=\"padding:4px 6px\">要处理边界、重复、迟到数据</td></tr>\n<tr><td style=\"padding:4px 6px\">适用</td><td style=\"padding:4px 6px\">小表、维表</td><td style=\"padding:4px 6px\">事实表、日志、事件流</td></tr>\n</table>\n<h3>水位线（watermark）：增量靠什么记住进度</h3>\n<pre>-- 取上次成功处理到的最大时间\nSELECT COALESCE(MAX(updated_at), '1970-01-01')\nFROM fact_trips;\n\n-- 下次只拉这之后的数据，并且往回多看一点，防迟到\nWHERE updated_at >= (SELECT MAX(updated_at) - INTERVAL '1 hour' FROM fact_trips)</pre>\n<p>为什么往回多看一小时：上游的数据可能延迟写入（11:05 才落一条 11:00 的记录）。留一个 overlap 窗口再靠 upsert 去重，比「精确衔接」可靠得多。</p>\n<h3>迟到数据与回填</h3>\n<ul>\n<li><b>迟到</b>：事件时间早于已处理水位线才到。处理方式：overlap + upsert，或按事件时间分区的覆盖重跑。</li>\n<li><b>回填（backfill）</b>：逻辑改了，要重算过去 90 天。所以管道必须<b>参数化日期</b>，不能写死 <code>now()</code>：\n<pre>python pipeline.py --start 2026-01-01 --end 2026-03-31</pre></li>\n</ul>\n<h3>一条硬规矩</h3>\n<p><b>任何管道都要能针对任意日期区间重跑，且结果与「当时跑」一致。</b>违反这条的管道，在第一次上游数据修正时就会变成灾难。</p>\n"},{"no":30,"p":4,"t":"数据质量与数据契约","lead":"「数据不对」比「数据没有」更可怕——没人会立刻发现，但所有决策都错了。质量要靠机制，不能靠人盯着。","de":["04"],"ex":[{"t":"给一张表写四条测试 SQL","c":"对 fct_trips 写：主键唯一、pickup 非空、fare>=0、zone_id 能对上维表","note":"四条都能写成返回 0 行即通过的查询"},{"t":"加一条新鲜度检查","c":"python -c \"\nimport duckdb\nprint(duckdb.sql(\\\"SELECT MAX(ts) AS latest, now() - MAX(ts) AS lag FROM (VALUES (TIMESTAMP '2026-01-01 10:00')) t(ts)\\\").df())\n\"","note":"lag 超过阈值就该告警，而不是等业务方来问"}],"cards":[{"k":"四类检查","d":"唯一、完整、有效、一致，覆盖九成问题","ex":"COUNT(*) = COUNT(DISTINCT id)"},{"k":"新鲜度监控","d":"MAX(ts) 太旧说明上游断了，但任务显示成功","ex":"MAX(ts) &lt; now() - INTERVAL '2 hour'"},{"k":"dbt tests","d":"unique / not_null / accepted_values / relationships","ex":"tests: [unique, not_null]"},{"k":"测试失败要阻断","d":"发通知继续跑等于让脏数据扩散","ex":"-- dbt test 非零退出码，编排器标失败"},{"k":"数据契约","d":"字段、类型、可空、稳定性写清楚并验证","ex":"-- schema 变更走 PR"},{"k":"三层监控","d":"任务层、数据层、业务层，业务层最难也最值钱","ex":"-- 核心指标同比告警"}],"res":[{"t":"Great Expectations","u":"https://greatexpectations.io/","d":"数据质量校验框架"},{"t":"dbt 文档","u":"https://docs.getdbt.com/docs/introduction","d":"模块 4 会用"}],"doc":"\n<h3>四类检查，覆盖九成问题</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:13.5px\">\n<tr><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">类型</th><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">检查什么</th><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">SQL 写法</th></tr>\n<tr><td style=\"padding:4px 6px\">唯一性</td><td style=\"padding:4px 6px\">主键不重复</td><td style=\"padding:4px 6px\">COUNT(*) = COUNT(DISTINCT id)</td></tr>\n<tr><td style=\"padding:4px 6px\">完整性</td><td style=\"padding:4px 6px\">关键字段不为空</td><td style=\"padding:4px 6px\">COUNT(*) FILTER (WHERE k IS NULL) = 0</td></tr>\n<tr><td style=\"padding:4px 6px\">有效性</td><td style=\"padding:4px 6px\">值在合理范围/枚举内</td><td style=\"padding:4px 6px\">fare &gt;= 0, status IN (...)</td></tr>\n<tr><td style=\"padding:4px 6px\">一致性</td><td style=\"padding:4px 6px\">外键能对上、跨表口径一致</td><td style=\"padding:4px 6px\">LEFT JOIN ... WHERE 右表 IS NULL</td></tr>\n</table>\n<p>再加一类最容易漏的：<b>新鲜度</b>。<code>MAX(ts)</code> 距现在超过 2 小时就告警——上游断了，你的表还在「成功」状态，这是最隐蔽的故障。</p>\n<h3>dbt 里怎么写</h3>\n<pre># models/schema.yml\nmodels:\n  - name: fct_trips\n    columns:\n      - name: trip_id\n        tests: [unique, not_null]\n      - name: payment_type\n        tests:\n          - accepted_values:\n              values: ['card', 'cash', 'no_charge']\n      - name: zone_id\n        tests:\n          - relationships:\n              to: ref('dim_zones')\n              field: location_id</pre>\n<p><code>dbt test</code> 会把这些变成 SQL 跑一遍，不通过就退出非零码，编排器据此标记任务失败。<b>测试失败要阻断下游</b>，而不是发个通知继续跑。</p>\n<h3>数据契约（data contract）</h3>\n<p>上游改字段名、改类型、停止写某个列——这是数据团队最常见的半夜告警来源。契约就是把「我承诺给你什么」写下来并可验证：</p>\n<pre>字段名      类型       可空   说明              稳定性\norder_id    string     否     订单唯一标识       stable\namount      numeric    否     实付金额，元       stable\nchannel     string     是     来源渠道           stable（枚举可增）</pre>\n<p>落在实践上：schema 变更走 PR、加列可以、删列/改类型必须提前通知并给迁移期。大公司有专门的 schema registry（Kafka + Avro 场景，模块 7 会碰到）。</p>\n<h3>监控的三层</h3>\n<ol>\n<li><b>任务层</b>：跑成功了吗？耗时多久？（编排器自带）</li>\n<li><b>数据层</b>：行数、空值率、分布是否异常？（测试 + 监控 SQL）</li>\n<li><b>业务层</b>：核心指标是否偏离预期？（同比环比告警，最有价值也最难做）</li>\n</ol>\n"},{"no":31,"p":4,"t":"云、成本与权限","lead":"课程用 GCP。你不用成为云专家，但必须会三件事：开项目、控成本、给权限。搞错任何一件，要么欠费，要么卡在 403。","de":["01","03"],"ex":[{"t":"确认当前 gcloud 上下文","c":"gcloud config list\ngcloud auth list","note":"看 account 和 project 是不是你要用的那个"},{"t":"给 BigQuery 查询加分区过滤并对比扫描量","c":"在 BigQuery 控制台跑两次同样的查询，一次带 WHERE dt=...，一次不带，对比界面右上角的 bytes processed","note":"差距通常几十倍，这一条就够理解成本模型"}],"cards":[{"k":"设预算告警","d":"Billing → Budgets，$10 阈值，第一个该做的设置","ex":"-- 50% / 90% / 100% 各发邮件"},{"k":"BigQuery 按扫描量计费","d":"查询前看预估字节数，加分区过滤","ex":"WHERE dt = '2026-01-01'"},{"k":"虚拟机用完就 stop","d":"关窗口不算停机，磁盘仍在计费","ex":"gcloud compute instances stop vm"},{"k":"IAM 最小权限","d":"服务账号只给它用到的角色","ex":"-- BigQuery Job User + Data Viewer"},{"k":"403 排查顺序","d":"config list → auth list → IAM 角色","ex":"gcloud config list"},{"k":"区域选择","d":"asia-east1 / asia-northeast1，就近且合规","ex":"--region=asia-east1"}],"res":[{"t":"BigQuery 费用控制","u":"https://cloud.google.com/bigquery/docs/best-practices-costs","d":"别一觉醒来欠费"},{"t":"官方环境搭建","u":"https://datatalksclub.github.io/docs/courses/data-engineering-zoomcamp/","d":"装什么、怎么装"}],"doc":"\n<h3>三个基本概念</h3>\n<ul>\n<li><b>项目（Project）</b>：所有资源的容器，也是计费单位。课程会让你新建一个，别在默认项目里乱搞。</li>\n<li><b>区域（Region）</b>：资源放在哪个机房。选近了快，选错了有跨境费用和数据合规问题。国内访问建议 <code>asia-east1</code>（台湾）或 <code>asia-northeast1</code>（东京）。</li>\n<li><b>IAM</b>：谁能对什么资源做什么。<b>最小权限</b>原则——跑管道的服务账号只需要它用到的几个角色。</li>\n</ul>\n<h3>课程会用到的几个服务</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:13.5px\">\n<tr><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">服务</th><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">干什么</th><th align=\"left\" style=\"padding:4px 6px;border-bottom:1px solid var(--line)\">计费方式</th></tr>\n<tr><td style=\"padding:4px 6px\">Cloud Storage (GCS)</td><td style=\"padding:4px 6px\">对象存储，放原始文件（数据湖）</td><td style=\"padding:4px 6px\">按存储量 + 流量</td></tr>\n<tr><td style=\"padding:4px 6px\">BigQuery</td><td style=\"padding:4px 6px\">数据仓库</td><td style=\"padding:4px 6px\">按<b>扫描字节数</b>（查询）+ 存储</td></tr>\n<tr><td style=\"padding:4px 6px\">Compute Engine</td><td style=\"padding:4px 6px\">虚拟机，跑 Docker</td><td style=\"padding:4px 6px\">按开机时长，关机也收磁盘费</td></tr>\n<tr><td style=\"padding:4px 6px\">IAM</td><td style=\"padding:4px 6px\">账号与权限</td><td style=\"padding:4px 6px\">免费</td></tr>\n</table>\n<h3>成本控制的五个动作（今天就做）</h3>\n<ol>\n<li><b>设预算告警</b>：Billing → Budgets &amp; alerts，设 $10，50%/90%/100% 各发一封邮件。这是唯一能救你的设置。</li>\n<li><b>BigQuery 查询加分区过滤</b>：不写 <code>WHERE dt = ...</code> 可能一次扫 100GB。查询前界面上会显示预估扫描量，看它。</li>\n<li><b>虚拟机用完就停</b>：<code>gcloud compute instances stop vm-name</code>。只关窗口不算停机。</li>\n<li><b>别 SELECT *</b>：列存下这是最贵的写法。</li>\n<li><b>删掉不用的表和数据集</b>：存储也在计费，虽然便宜但你不会记得它存在。</li>\n</ol>\n<p>免费额度参考（新账号 $300 / 90 天）：BigQuery 每月 1TB 查询 + 10GB 存储免费。按课程的量，正常用不会超；但一次忘记加分区的大查询就能烧掉几美元。</p>\n<h3>最常见的 403 与解法</h3>\n<pre>403 Access Denied: User does not have bigquery.jobs.create\n→ 缺 BigQuery Job User 角色\n\n403: The caller does not have permission\n→ 服务账号没绑定角色，或用了错的 key 文件\n\n401: Request had invalid authentication credentials\n→ gcloud auth application-default login 重新登录</pre>\n<p>排查顺序：<code>gcloud config list</code>（当前账号和项目）→ <code>gcloud auth list</code>（谁在认证）→ IAM 页面看这个账号有什么角色。八成问题在「项目选错了」或「服务账号没授权」。</p>\n"},{"no":32,"p":4,"t":"编排与调度","lead":"脚本能跑不等于管道能跑。谁来每天 6 点触发它？失败了谁知道？跑了三小时卡住怎么办？这就是编排器要解决的事。","de":["02"],"ex":[{"t":"把一个脚本改造成「可编排」","c":"给它加 --date 参数、加超时、加失败非零退出码，然后用 shell 循环模拟回填","note":"for d in 01 02 03; do python pipe.py --date 2026-01-$d || break; done"},{"t":"读一遍 Kestra 的 quickstart","c":"打开 kestra.io/docs，找到 Quickstart，看它怎么定义一个 flow 并手动触发","note":"重点看 trigger 和 dependsOn 两块，其余先跳过"}],"cards":[{"k":"DAG + 依赖","d":"编排器的核心：声明任务和先后，自动排顺序","ex":"task_a >> task_b"},{"k":"逻辑日期","d":"处理的是「哪一天」的数据，不是 now()","ex":"{{ ds }} / {{ trigger.date }}"},{"k":"重试与超时","d":"网络抖动自愈，挂死不会拖住整条链路","ex":"retries: 3, timeout: 1h"},{"k":"回填 backfill","d":"按日期区间批量重跑，前提是管道参数化了","ex":"--start ... --end ..."},{"k":"六条健康标准","d":"幂等、参数化、超时、重试、质量检查、告警","ex":"-- 比选哪个工具重要"}],"res":[{"t":"Kestra 文档","u":"https://kestra.io/docs","d":"模块 2 的编排器"},{"t":"Airflow 核心概念","u":"https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/index.html","d":"DAG 心智模型通用"}],"doc":"\n<h3>为什么 cron 不够</h3>\n<pre>0 6 * * * python /app/pipeline.py</pre>\n<p>能跑，但：</p>\n<ul>\n<li>任务 A 要等任务 B 成功才能跑？cron 不知道依赖。</li>\n<li>失败了要重试三次？cron 不会。</li>\n<li>前端卡住了要告警？得自己写。</li>\n<li>要补跑过去 30 天？得手写循环。</li>\n<li>跑到哪一步了？看日志文件猜。</li>\n</ul>\n<h3>编排器的五个核心能力</h3>\n<ol>\n<li><b>DAG</b>：用代码/配置声明任务和依赖，编排器算出执行顺序。</li>\n<li><b>调度</b>：按 cron 或事件触发，管理「这一次运行」的上下文（哪一天、哪个分区）。</li>\n<li><b>重试与超时</b>：失败自动重试 N 次、超时强制失败。</li>\n<li><b>可观测</b>：每个任务的日志、状态、耗时、历史都在一个界面。</li>\n<li><b>回填</b>：一次指定日期区间，批量重跑历史。</li>\n</ol>\n<h3>Airflow 的心智模型（通用）</h3>\n<pre>DAG（一个有向无环图）\n └─ Task（一个算子：跑 Python、跑 SQL、跑 Docker）\n      ├─ 依赖：task_b >> task_c  表示 b 完成后才跑 c\n      └─ 每次执行叫一次 DagRun，带一个逻辑日期（logical date）\n           └─ 每个 TaskInstance 有状态：queued/running/success/failed/retry</pre>\n<p>课程模块 2 用的是 <b>Kestra</b>，但概念完全一致，只是配置换成 YAML：</p>\n<pre>id: taxi_pipeline\nnamespace: zoomcamp\n\ntasks:\n  - id: extract\n    type: io.kestra.plugin.scripts.python.Commands\n    commands:\n      - python extract.py --date {{ trigger.date }}\n\n  - id: load\n    type: io.kestra.plugin.jdbc.postgresql.Query\n    dependsOn: [extract]\n    sql: |\n      COPY trips FROM ...</pre>\n<h3>「逻辑日期」这个概念最容易搞错</h3>\n<p>每天 6 点跑的管道，处理的是<b>昨天</b>的数据。所以不要写 <code>now()</code>，要用编排器给的执行日期（Airflow 的 <code>ds</code>、Kestra 的 <code>trigger.date</code>）。写 <code>now()</code> 的管道在回填时必然出错——它永远只处理今天。</p>\n<h3>一个健康的管道长什么样</h3>\n<pre>1. 幂等（重跑安全）\n2. 参数化日期（能回填）\n3. 有超时（不会挂死）\n4. 有重试（网络抖动自愈）\n5. 有数据质量检查（脏数据不下传）\n6. 失败告警到人（不只是界面变红）</pre>\n<p>这六条比「用什么工具」重要得多。工具换了三轮，这六条不变。</p>\n"}],"parts":{"1":["第一块","编程与数据操作","把 Python 从「会写语法」推到「能处理一批数据」。这一块不学新语言，学的是文件、接口、日志、表格这些真活儿。"],"2":["第二块","SQL 进阶","你有 MySQL 基础，缺的是分析型写法：窗口函数、CTE、执行计划，还有 NULL 和时区这两个坑。"],"3":["第三块","工程工具链","Git、Docker、命令行、配置文件——课程第一天就要用，卡在这里会一直卡。"],"4":["第四块","数据工程概念","工具天天换，概念不变。先建立数据流、建模、分层、幂等这套词汇，看视频才不会懵。"]},"de":{"00":"课程总览与环境","01":"Docker 与 Terraform","02":"工作流编排","03":"数据仓库","04":"分析工程","05":"数据平台","06":"批处理","07":"流处理"},"ncards":181,"quiz":[{"id":"q1","t":"我能用 venv 建虚拟环境，并用 requirements.txt 复现一套依赖","p":1},{"id":"q2","t":"我能用 requests 调接口，处理分页、超时和 429","p":1},{"id":"q3","t":"我用 pandas 读过 CSV，做过筛选、新列、groupby 聚合","p":1},{"id":"q4","t":"我知道 merge 会让行数膨胀，会先检查连接键是否唯一","p":1},{"id":"q5","t":"我写过窗口函数（row_number / lag / sum over）","p":2},{"id":"q6","t":"我知道 NOT IN 的子查询里有 NULL 会一行都查不出","p":2},{"id":"q7","t":"我看过 EXPLAIN，知道 type=ALL 是全表扫描","p":2},{"id":"q8","t":"我知道金额要用 NUMERIC 而不是 FLOAT，时间要存 UTC","p":2},{"id":"q9","t":"我能独立完成 clone → 改 → commit → push 一整轮","p":3},{"id":"q10","t":"我跑过 docker run，并且理解 volume 和端口映射","p":3},{"id":"q11","t":"我知道 ODS / DWD / DWS / ADS 各做什么","p":4},{"id":"q12","t":"我能解释「幂等」，并写出重跑三次结果不变的写入","p":4}]};</script>
<script>
(function () {
  "use strict";
  var CHS = DATA.chapters;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  };

  var done = {}, notes = {};
  try { done = JSON.parse(localStorage.getItem("fund.done.v1") || "{}"); } catch (e) {}
  try { notes = JSON.parse(localStorage.getItem("fund.notes.v1") || "{}"); } catch (e) {}
  var saveDone = function () { try { localStorage.setItem("fund.done.v1", JSON.stringify(done)); } catch (e) {} };
  var saveNotes = function () { try { localStorage.setItem("fund.notes.v1", JSON.stringify(notes)); } catch (e) {} };

  var cur = 1, pane = "doc", curObj = null;

  /* ---------- 目录 ---------- */
  function renderSide() {
    var html = "", lastP = 0, cnt = {};
    CHS.forEach(function (c) {
      cnt[c.p] = cnt[c.p] || [0, 0];
      cnt[c.p][1]++;
      if (done[c.no]) cnt[c.p][0]++;
    });
    CHS.forEach(function (c) {
      if (c.p !== lastP) {
        lastP = c.p;
        var pi = DATA.parts[String(c.p)] || ["", "", ""];
        html += '<div class="ptitle"><span class="pn">' + esc(pi[0]) + '</span><span>' +
                esc(pi[1]) + '</span><span class="cnt">' + cnt[c.p][0] + "/" + cnt[c.p][1] +
                '</span></div>';
      }
      html += '<button class="ch' + (c.no === cur ? " cur" : "") + (done[c.no] ? " done" : "") +
              '" data-no="' + c.no + '">' +
              '<span class="no">' + (c.no < 10 ? "0" + c.no : c.no) + '</span>' +
              '<span class="ct">' + esc(c.t) +
              (c.de && c.de.length ? '<span class="de">DE ' + esc(c.de[0]) + '</span>' : "") +
              '</span></button>';
    });
    $("side").innerHTML = html;
    var n = Object.keys(done).filter(function (k) { return done[k]; }).length;
    $("st-done").textContent = n;
    $("st-total").textContent = CHS.length;
    try { localStorage.setItem("hub.fund", JSON.stringify({ done: n, total: CHS.length })); } catch (e) {}
  }

  /* ---------- 资源 ---------- */
  function renderRes(c) {
    var g = $("rgrid");
    $("h-resn").textContent = c.res.length ? "（" + c.res.length + " 个）" : "";
    if (c.res.length) {
      g.innerHTML = c.res.map(function (r) {
        return '<a class="rcard" href="' + esc(r.u) + '" target="_blank" rel="noopener">' +
               '<div class="rt">' + esc(r.t) + '<span class="arw">↗</span></div>' +
               '<div class="rd">' + esc(r.d) + '</div></a>';
      }).join("");
    } else {
      g.innerHTML = '<div class="rd" style="color:var(--muted-2);font-size:12.5px">' +
                    '这一节以讲义和练习为主，没有指定外部资料。</div>';
    }
    var q = encodeURIComponent("data engineering " + c.t);
    $("rsearch").innerHTML = '<span>想看视频讲这一节：</span>' +
      '<a class="btn sm" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=' + q + '">YouTube</a>' +
      '<a class="btn sm" target="_blank" rel="noopener" href="https://www.bilibili.com/search?keyword=' + q + '">B 站</a>';
  }

  /* ---------- 面板 ---------- */
  function cardHtml(c) {
    return c.cards.map(function (m, i) {
      return '<div class="cmd" id="cd' + i + '"><div class="k">' + esc(m.k) + '</div>' +
             '<div class="d">' + esc(m.d) + '</div>' +
             (m.ex ? '<div class="ex"><pre>' + esc(m.ex) + '</pre>' +
               '<button class="copy" data-copytext="' + esc(m.ex) + '">复制</button></div>' : "") +
             '</div>';
    }).join("");
  }
  function exHtml(c) {
    return c.ex.map(function (x, i) {
      return '<div class="ex"><div class="t">练习 ' + (i + 1) + '：' + esc(x.t) + '</div>' +
             (x.note ? '<div class="note">' + esc(x.note) + '</div>' : "") +
             '<div class="ex"><pre>' + esc(x.c) + '</pre>' +
             '<button class="copy" data-copytext="' + esc(x.c) + '">复制</button></div></div>';
    }).join("");
  }

  function setPane(p) {
    pane = p;
    [].forEach.call(document.querySelectorAll(".tab"), function (t) {
      t.classList.toggle("on", t.getAttribute("data-pane") === p);
    });
    $("pane-doc").hidden = p !== "doc";
    $("pane-card").hidden = p !== "card";
    $("pane-ex").hidden = p !== "ex";
  }

  /* ---------- 章头 ---------- */
  function renderHead(c) {
    $("h-title").textContent = c.no + ". " + c.t;
    var pi = DATA.parts[String(c.p)] || ["", ""];
    var meta = ['<span class="tag">' + esc(pi[0]) + " · " + esc(pi[1]) + "</span>"];
    if (c.de && c.de.length) {
      meta.push('<span>配合 DE：' + c.de.map(function (k) {
        return '<a href="../index.html#m-' + k + '">' + k + " " + esc(DATA.de[k] || "") + "</a>";
      }).join("、") + "</span>");
    }
    meta.push("<span>" + c.cards.length + " 张卡 · " + c.ex.length + " 个练习</span>");
    $("h-meta").innerHTML = meta.join("");
    $("h-lead").textContent = c.lead || "";

    var r = [];
    if (c.de && c.de.length) {
      r.push('<div class="kv"><span class="k">配合</span><span class="v">' +
             c.de.join(", ") + "</span></div>");
    }
    r.push('<div class="kv"><span class="k">资源</span><span class="v">' + c.res.length + " 个</span></div>");
    r.push('<div class="kv"><span class="k">状态</span><span class="v">' +
           (done[c.no] ? "已完成" : "未完成") + "</span></div>");
    $("rinfo").innerHTML = r.join("");
    $("h-pos").textContent = c.no + " / " + CHS.length;
  }

  /* ---------- 笔记 ---------- */
  var tid = null;
  function loadNote(c) {
    var ta = $("note");
    ta.value = notes[c.no] || "";
    $("nlen").textContent = ta.value.length + " 字";
    $("nstate").textContent = "自动保存";
  }
  $("note").addEventListener("input", function () {
    var ta = this;
    $("nlen").textContent = ta.value.length + " 字";
    $("nstate").textContent = "…";
    clearTimeout(tid);
    tid = setTimeout(function () {
      notes[cur] = ta.value;
      saveNotes();
      $("nstate").textContent = "已存";
    }, 400);
  });

  /* ---------- 选择 ---------- */
  function select(no, push) {
    var c = null, i;
    for (i = 0; i < CHS.length; i++) if (CHS[i].no === no) c = CHS[i];
    if (!c) return;
    cur = no;
    curObj = c;
    [].forEach.call(document.querySelectorAll(".ch"), function (b) {
      b.classList.toggle("cur", +b.getAttribute("data-no") === no);
    });
    renderHead(c);
    renderRes(c);
    $("pane-doc").innerHTML = c.doc;
    $("pane-card").innerHTML = cardHtml(c);
    $("pane-ex").innerHTML = exHtml(c);
    setPane(pane);
    loadNote(c);
    syncDoneBtn();
    if (push !== false) {
      try { history.replaceState(null, "", "?n=" + no); } catch (e) {}
    }
    var paneEl = document.querySelector(".pane:not([hidden])");
    if (paneEl) paneEl.scrollTop = 0;
  }

  function syncDoneBtn() {
    var b = $("btn-done");
    b.textContent = done[cur] ? "取消完成" : "标记完成";
    b.classList.toggle("go", !!done[cur]);
  }

  /* ---------- 事件 ---------- */
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-copytext]");
    if (b) {
      var txt = b.getAttribute("data-copytext");
      var ok = function () { b.textContent = "已复制"; setTimeout(function () { b.textContent = "复制"; }, 1200); };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(txt).then(ok, function () { fallback(txt, ok); });
      } else { fallback(txt, ok); }
      return;
    }
    var ch = ev.target.closest(".ch");
    if (ch) { select(+ch.getAttribute("data-no")); }
  });

  function fallback(txt, cb) {
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); if (cb) cb(); } catch (e) {}
    document.body.removeChild(ta);
  }

  [].forEach.call(document.querySelectorAll(".tab"), function (t) {
    t.addEventListener("click", function () { setPane(t.getAttribute("data-pane")); });
  });

  $("btn-done").addEventListener("click", function () {
    done[cur] = !done[cur];
    saveDone();
    renderSide();
    syncDoneBtn();
  });
  $("btn-prev").addEventListener("click", function () { if (cur > 1) select(cur - 1); });
  $("btn-next").addEventListener("click", function () { if (cur < CHS.length) select(cur + 1); });

  ["btn-prev", "btn-next"].forEach(function (id) {
    $(id).addEventListener("click", function () {
      var el = document.querySelector(".pane:not([hidden])");
      if (el) el.scrollTop = 0;
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  document.addEventListener("keydown", function (ev) {
    if (/^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
    if (ev.key === "ArrowRight" || ev.key === "j") { if (cur < CHS.length) select(cur + 1); }
    else if (ev.key === "ArrowLeft" || ev.key === "k") { if (cur > 1) select(cur - 1); }
    else if (ev.key === "1") setPane("doc");
    else if (ev.key === "2") setPane("card");
    else if (ev.key === "3") setPane("ex");
  });

  /* ---------- 启动 ---------- */
  renderSide();
  var start = 1;
  var m = location.search.match(/[?&]n=(\d+)/);
  var tm = location.search.match(/[?&]tab=(doc|card|ex)/);
  if (tm) pane = tm[1];
  if (m) start = +m[1];
  else {
    var last = 0;
    for (var k in done) if (done[k]) last = Math.max(last, +k);
    start = Math.min(last + 1, CHS.length) || 1;
  }
  /* 从 DE 课程某集跳过来时，给一条「回去」的通道 */
  (function () {
    var bm = location.search.match(/[?&]back=([^&]+)/);
    if (!bm) return;
    var back = decodeURIComponent(bm[1]);
    var tm2 = location.search.match(/[?&]bt=([^&]+)/);
    var epTitle = tm2 ? decodeURIComponent(tm2[1]).replace(/\+/g, " ") : "";
    var bar = document.getElementById("frombar");
    document.getElementById("fromtxt").textContent =
      "你从 DE 课程" + (epTitle ? "《" + epTitle + "》" : "") + "那一集跳过来补这节";
    var a = document.getElementById("fromback");
    a.href = "../" + back;
    bar.hidden = false;
  })();

  select(start, false);

  /* 从知识树的「树叶」点进来：滚到那张卡并高亮 */
  (function () {
    var km = location.search.match(/[?&]k=(\d+)/);
    if (!km) return;
    setTimeout(function () {
      var el = document.getElementById("cd" + km[1]);
      if (!el) return;
      try { el.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (x) { el.scrollIntoView(); }
      el.classList.add("flash");
      setTimeout(function () { el.classList.remove("flash"); }, 2600);
    }, 260);
  })();
})();
</script>
<script>
/* 三栏学习台：拖动分栏改宽 + 单栏一键收起（DE / 基础预备 / Linux 共用）
   直接内联进各页，不依赖外部文件。 */
(function () {
  var grid = document.querySelector("main.grid");
  if (!grid) return;

  var KEY = "dezc.panels.v1";
  var st = {};
  try { st = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { st = {}; }
  st.w = st.w || {};
  st.h = st.h || {};

  var page = location.pathname.indexOf("/fund/") >= 0 ? "fund"
           : location.pathname.indexOf("/linux/") >= 0 ? "linux" : "de";

  var panels = [].filter.call(grid.children, function (el) {
    return el.nodeType === 1 && !el.classList.contains("split");
  });
  if (panels.length < 2) return;

  var flexAt = -1, i;
  for (i = 0; i < panels.length; i++) {
    if (panels[i].classList.contains("stage") || panels[i].classList.contains("mid")) flexAt = i;
  }

  /* 与各页 CSS 的堆叠断点对齐：带右栏的两套在 1220 收成一列 */
  var NARROW = panels.some(function (p) { return p.classList.contains("right"); }) ? 1220 : 1000;
  var MIN = 200, MIN_DOC = 250, MAX = 1100;

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
  }
  function minOf(p) {
    return (p.classList.contains("doc") || p.classList.contains("mid")) ? MIN_DOC : MIN;
  }
  function label(p) {
    if (p.dataset && p.dataset.tg) return p.dataset.tg;
    if (p.classList.contains("doc")) return "讲义";
    if (p.classList.contains("side")) return "目录";
    if (p.classList.contains("right")) return "笔记";
    return "";
  }
  function setW(p, idx, px) {
    p.style.flex = "0 0 " + px + "px";
    p.style.width = px + "px";
    st.w[page + idx] = Math.round(px);
  }

  /* ---------- 分栏条 ---------- */
  var splits = [];
  for (i = 0; i < panels.length - 1; i++) {
    (function (k) {
      var a = panels[k], b = panels[k + 1];
      var sp = document.createElement("div");
      sp.className = "split";
      sp.title = "拖动调宽 · 双击复位";
      sp.setAttribute("role", "separator");
      sp.setAttribute("aria-orientation", "vertical");
      grid.insertBefore(sp, b);
      splits.push({ el: sp, a: a, b: b, k: k });

      sp.addEventListener("pointerdown", function (ev) {
        if (ev.button !== 0) return;
        ev.preventDefault();
        var ra = a.getBoundingClientRect().width,
            rb = b.getBoundingClientRect().width,
            x0 = ev.clientX,
            flexA = k === flexAt,
            flexB = k + 1 === flexAt,
            minA = minOf(a), minB = minOf(b);
        var mask = document.getElementById("dragmask");
        if (!mask) {
          mask = document.createElement("div");
          mask.id = "dragmask";
          mask.className = "dragmask";
          document.body.appendChild(mask);
        }
        mask.hidden = false;
        sp.classList.add("drag");
        function move(e) {
          var dx = e.clientX - x0, wa, wb;
          if (flexA) {
            wb = Math.max(minB, Math.min(MAX, rb - dx));
            setW(b, k + 1, wb);
          } else if (flexB) {
            wa = Math.max(minA, Math.min(MAX, ra + dx));
            setW(a, k, wa);
          } else {
            wa = Math.max(minA, Math.min(MAX, ra + dx));
            wb = rb - (wa - ra);
            if (wb < minB) { wb = minB; wa = ra + rb - wb; }
            setW(a, k, wa); setW(b, k + 1, wb);
          }
        }
        function up() {
          mask.hidden = true;
          sp.classList.remove("drag");
          document.removeEventListener("pointermove", move);
          document.removeEventListener("pointerup", up);
          save();
        }
        document.addEventListener("pointermove", move);
        document.addEventListener("pointerup", up);
      });

      sp.addEventListener("dblclick", function () {
        [a, b].forEach(function (p) {
          p.style.flex = ""; p.style.width = "";
        });
        delete st.w[page + k];
        delete st.w[page + (k + 1)];
        save();
      });
    })(i);
  }

  /* ---------- 收起按钮 ---------- */
  var top = document.querySelector(".top");
  if (!top) {
    top = document.createElement("div");
    top.className = "top";
    document.body.insertBefore(top, document.body.firstChild);
  }
  var btns = [];
  panels.forEach(function (p, idx) {
    if (idx === flexAt) return;
    var t = label(p);
    if (!t) return;
    var b = document.createElement("button");
    b.className = "btn sm tg";
    b.type = "button";
    b.textContent = t;
    b.title = "显示 / 收起「" + t + "」这一栏";
    b.addEventListener("click", function () {
      var hid = !p.hidden;
      p.hidden = hid;
      p.style.display = hid ? "none" : "";
      st.h[page + idx] = hid;
      save();
      paint();
    });
    /* 插在顶栏靠右的位置：倒数第二个按钮前 */
    var anchor = top.querySelector("#btn-read") || top.lastElementChild;
    top.insertBefore(b, anchor);
    btns.push({ b: b, p: p, idx: idx });
  });

  function paint() {
    btns.forEach(function (o) {
      o.b.classList.toggle("on", !o.p.hidden);
      o.b.setAttribute("aria-pressed", o.p.hidden ? "false" : "true");
    });
    splits.forEach(function (s) {
      s.el.hidden = s.a.hidden || s.b.hidden;
    });
  }

  function layout() {
    var wide = window.innerWidth > NARROW;
    panels.forEach(function (p, idx) {
      if (idx === flexAt) return;
      var w = st.w[page + idx];
      if (wide && w) setW(p, idx, w);
      else if (!wide) { p.style.flex = ""; p.style.width = ""; }
    });
    if (!wide) {
      /* 窄屏回到单列，全部显示 */
      panels.forEach(function (p) { if (p.hidden) { p.hidden = false; p.style.display = ""; } });
    } else {
      panels.forEach(function (p, idx) {
        var h = st.h[page + idx];
        if (h) { p.hidden = true; p.style.display = "none"; }
      });
    }
    paint();
  }

  layout();
  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(layout, 160);
  });
})();

</script>
</body>
