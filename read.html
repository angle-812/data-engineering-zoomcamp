<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>讲义 · 竖屏阅读</title>
<style>
  :root{
    --bg:#fbfbfa; --card:#ffffff; --line:#e6e8ec; --line-soft:#f0f1f4;
    --text:#1a1d22; --muted:#6b7480; --muted-2:#98a1ad;
    --accent:#2563eb; --accent-weak:#eef3ff; --accent-line:#cfdcff;
    --fs:18px; --lh:1.95;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#101317; --card:#171b21; --line:#282f39; --line-soft:#20262e;
      --text:#e6eaf0; --muted:#9aa4b2; --muted-2:#79838f;
      --accent:#7ea8ff; --accent-weak:#182233; --accent-line:#2c3d5a;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font:var(--fs)/var(--lh) Georgia,"Songti SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:80px;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  .bar{
    position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  }
  .bar .in{
    display:flex;align-items:center;gap:9px;padding:9px 16px;max-width:52em;margin:0 auto;
  }
  .bar .meta{flex:1;min-width:0}
  .bar .mt{font:12px/1.4 system-ui,sans-serif;color:var(--muted-2);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .bar .mn{font:600 13.5px/1.35 system-ui,sans-serif;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .ic{
    flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);
    width:30px;height:30px;border-radius:8px;cursor:pointer;font:13px/1 system-ui,sans-serif;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .ic:hover{border-color:var(--accent-line);color:var(--accent)}
  .ic a{color:inherit;display:flex;width:100%;height:100%;align-items:center;justify-content:center}
  .prog{height:2px;background:transparent}
  .prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}

  main{max-width:40em;margin:0 auto;padding:26px 22px 40px}
  @media (max-width:520px){ main{padding:20px 16px 36px} }

  h1,h2,h3,h4{line-height:1.42;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;letter-spacing:-.01em}
  h1{font-size:1.5em;margin:0 0 .7em;padding-bottom:.4em;border-bottom:1px solid var(--line)}
  h2{font-size:1.24em;margin:1.7em 0 .6em;padding-bottom:.3em;border-bottom:1px solid var(--line-soft)}
  h3{font-size:1.06em;margin:1.5em 0 .5em}
  h4{font-size:.98em;margin:1.3em 0 .4em;color:var(--muted)}
  p{margin:.85em 0}
  ul,ol{margin:.8em 0;padding-left:1.5em}
  li{margin:.35em 0}
  code{
    background:var(--card);border:1px solid var(--line-soft);border-radius:5px;
    padding:.1em .34em;font:.85em/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;
    word-break:break-word;
  }
  pre{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;overflow:auto;margin:1em 0;
  }
  pre code{background:none;border:0;padding:0;font-size:.78em;line-height:1.65;word-break:normal}
  table{border-collapse:collapse;width:100%;margin:1em 0;font:.82em/1.6 system-ui,sans-serif;display:block;overflow-x:auto}
  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  th{background:var(--card);font-weight:600}
  img{max-width:100%;height:auto;border-radius:9px;border:1px solid var(--line-soft);
    display:block;margin:1.1em 0;cursor:zoom-in}
  .lb{position:fixed;inset:0;z-index:200;background:rgba(8,10,14,.92);
    display:flex;align-items:center;justify-content:center;padding:14px;cursor:zoom-out}
  .lb[hidden]{display:none}
  .lb img{max-width:100%;max-height:100%;border-radius:6px;margin:0}
  blockquote{
    margin:1em 0;padding:.2em 0 .2em 14px;border-left:3px solid var(--accent-line);
    color:var(--muted);font-style:normal;
  }
  hr{border:0;border-top:1px solid var(--line);margin:1.8em 0}

  .nav{
    display:flex;gap:10px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
    font:13px/1.5 system-ui,sans-serif;
  }
  .nav button{
    flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);
    padding:10px 12px;border-radius:9px;cursor:pointer;font:inherit;text-align:left;
    display:flex;flex-direction:column;gap:2px;min-width:0;
  }
  .nav button:hover{border-color:var(--accent-line);color:var(--accent)}
  .nav button .k{font-size:10.5px;color:var(--muted-2)}
  .nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav button:disabled{opacity:.35;cursor:default;border-color:var(--line);color:var(--muted)}
  .nav button.r{text-align:right;align-items:flex-end}

  .loading,.err{padding:40px 4px;color:var(--muted);font:14px/1.8 system-ui,sans-serif}
  .err b{color:var(--text)}
  .hint{
    max-width:40em;margin:0 auto;padding:9px 22px 0;
    font:12px/1.6 system-ui,sans-serif;color:var(--muted-2);
  }
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--text);color:var(--bg);padding:8px 16px;border-radius:20px;
    font:13px/1 system-ui,sans-serif;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;
  }
  .toast.on{opacity:.92}
  .localf{
    width:100%;height:calc(100vh - 110px);border:1px solid var(--line);
    border-radius:10px;background:#fff;
  }
  .tr-zh{
    color:var(--muted);font-size:.9em;line-height:1.78;
    border-left:2px solid var(--accent-line);padding-left:12px;margin:.2em 0 .9em;
  }
  .ic.on{background:var(--accent-weak);border-color:var(--accent-line);color:var(--accent);font-weight:600}
</style>
</head>
<body>

<div class="bar">
  <div class="in">
    <button class="ic" id="b-back" title="回学习台">←</button>
    <div class="meta">
      <div class="mt" id="m-t">—</div>
      <div class="mn" id="m-n">正在载入…</div>
    </div>
    <button class="ic" id="b-tr" title="中英对照（原文下面加中文）">中</button>
    <button class="ic" id="b-fs-" title="字号变小">A－</button>
    <button class="ic" id="b-fs+" title="字号变大">A＋</button>
    <button class="ic" id="b-open" title="看原文">↗</button>
  </div>
  <div class="prog"><i id="prog"></i></div>
</div>

<div class="hint" id="hint">竖屏阅读：把窗口拖到副屏，按住标题栏拖到屏幕边缘会吸附成整屏。视频留在主屏的学习台，两边会跟着走。</div>

<main id="body"><div class="loading">正在取讲义…</div></main>
<div class="lb" id="lb" hidden><img id="lb-img" alt=""></div>

<div class="toast" id="toast"></div>

  /* 启动：?i= 索引 或 ?p= 路径 */
  (function boot() {
    var m = /[?&]i=(\d+)/.exec(location.search);
    var idx = m ? parseInt(m[1], 10) : 0;
    if (!m) {
      var pm = /[?&]p=([^&]+)/.exec(location.search);
      if (pm) {
        var want = decodeURIComponent(pm[1]);
        for (var i = 0; i < EPS.length; i++) if (EPS[i].p === want) { idx = i; break; }
      }
    }
    if (idx < 0 || idx >= EPS.length) idx = 0;
    load(idx);
  })();

  /* 图片单击放大（副屏上放大看图） */
  (function () {
    var lb = document.getElementById("lb"), im = document.getElementById("lb-img");
    var body = document.getElementById("body");
    body.addEventListener("click", function (ev) {
      var t = ev.target;
      if (t && t.tagName === "IMG") {
        im.src = t.currentSrc || t.src;
        lb.removeAttribute("hidden");
      }
    });
    function close() { lb.setAttribute("hidden", ""); im.src = ""; }
    lb.addEventListener("click", close);
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") close();
    });
  })();
})();
</script>
</body>
</html>
